const UNITS=['kg','l','m','cm','km','quả','cái','quyển','bông','viên','nhãn','cây','chân','hàng','học sinh','đồng','giờ','km/giờ','túi','người','lần','ngày','ngón tay'];
const fw=x=>`width:${Math.max(3.2,f(x).length*.7+1.4)}em`;
function pnum(s){s=String(s||'').replace(/[\s\u00a0]/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return /^-?\d*\.?\d+$/.test(s)?+s:NaN}
const near=(a,b)=>Math.abs(a-b)<1e-6;
function gradeFill(q){
  const F=q.fill,v={},mk={};let ok=true;
  document.querySelectorAll('.sol input,.sol select').forEach(el=>v[el.id]=el.value);
  document.querySelectorAll('.sol .opb').forEach(el=>v[el.id]=el.dataset.op||'');
  F.S.forEach((st,si)=>{
    const nums=[],ops=[];st.t.forEach((x,ti)=>ti%2?ops.push(['o'+si+'-'+ti,x]):nums.push(['n'+si+'-'+ti,x]));
    const got=nums.map(([id])=>pnum(v[id]));
    let order=nums.map(n=>n[1]);
    const swap=nums.length===2&&(ops[0][1]==='+'||ops[0][1]==='×')&&near(got[0],nums[1][1])&&near(got[1],nums[0][1]);
    if(swap)order=[nums[1][1],nums[0][1]];
    nums.forEach(([id],k)=>{mk[id]=near(got[k],order[k])?'ok':'bad'});
    ops.forEach(([id,o])=>{mk[id]=v[id]===o?'ok':'bad'});
    mk['r'+si]=near(pnum(v['r'+si]),st.r)?'ok':'bad';
  });
  mk.ans=near(pnum(v.fans),F.ans)?'ok':'bad';mk.unit=v.funit===F.unit?'ok':'bad';
  for(const k in mk)if(mk[k]==='bad')ok=false;
  return {v,mk,ok};
}
function makeQs(n,gen){const qs=[],seen=new Set();let k=0;while(qs.length<n&&k<n*20){k++;const [g,tag]=gen();const q=g();const key=q.q+'|'+q.a;if(seen.has(key)&&k<n*15)continue;seen.add(key);q.tag=tag;qs.push(q)}return qs}
function gradeGen(){const all=G().chap.flatMap(c=>c.tp);return ()=>{const t=pick(all);return [t.g,t.t]}}
function feed(r){
  data.meals++;r.meal=true;
  if(data.meals>=NEED[data.stage]){data.meals=0;if(data.stage<3){data.stage++;r.evolved=true}else{data.stars+=20;data.earned+=20;r.bonus+=20}}
}
function finish(){
  const Z=S.quiz,r={kind:Z.kind,arg:Z.arg,title:Z.title,c:Z.c,bonus:0,meal:false,evolved:false,wrong:[]};
  if(Z.kind==='exam'){r.total=20;r.correct=0;Z.qs.forEach((q,k)=>{if(Z.ans[k]===q.a)r.correct++;else r.wrong.push({q,p:Z.ans[k]??'(bỏ trống)'})})}
  else if(Z.kind==='blitz'){r.total=Z.n;r.correct=Z.score}
  else{r.total=Z.qs.length;r.correct=Z.score;r.wrong=Z.wrong}
  const t=today();data.daily[t]=data.daily[t]||{n:0,c:0};data.daily[t].n+=r.total;data.daily[t].c+=r.correct;
  if(!data.days.includes(t))data.days.push(t);
  data.stars+=r.correct;data.earned+=r.correct;data.quizzes++;
  const pct=r.total?r.correct/r.total:0;
  if(Z.kind!=='blitz'&&pct>=.8)feed(r);
  if(Z.kind==='blitz'){r.record=r.correct>data.bestBlitz;data.bestBlitz=Math.max(data.bestBlitz,r.correct);if(r.correct>=8)feed(r)}
  if(Z.kind==='exam'){data.exams++;data.bestExam=Math.max(data.bestExam??0,r.correct);if(Z.left<=0)r.timeout=true}
  if(Z.kind!=='blitz'&&r.correct===r.total)data.perfect++;
  r.st=pct>=.9?3:pct>=.7?2:pct>=.5?1:0;
  if((Z.kind==='topic'||Z.kind==='fill')&&Z.arg){if(r.st===3&&(data.prog[Z.arg]||0)<3){data.stars+=5;data.earned+=5;r.bonus+=5}data.prog[Z.arg]=Math.max(data.prog[Z.arg]||0,r.st)}
  if(data.resume&&data.resume.id===Z.id)data.resume=null;
  r.newStk=checkStk();save();
  S.res=r;S.view='result';S.quiz=null;render();
}
/* ===================== BẢNG TRƯỢT ===================== */
const PRIZES=[5,10,20,5,50,10,'meal',15];
function vSheet(){
  const s=S.sheet;if(!s)return '';
  const wrap=(t,b)=>`<div class="ov" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="${t}" data-stop="1"><div class="sh"><h2>${t}</h2><button class="x" data-act="close" aria-label="Đóng">×</button></div>${b}</div></div>`;
  if(s==='profile')return wrap('Hồ sơ của bé',`<div class="fld"><label for="pName">Tên của bé</label><input id="pName" maxlength="20" value="${esc(data.name)}"></div>
    <div class="fld"><label>Chọn lớp</label><div class="gpick">${[1,2,3,4,5].map(n=>`<button class="${n===(S.pg||data.grade)?'on':''}" style="--gc:var(${GRADES[n-1].c})" data-act="pGrade" data-arg="${n}" aria-label="Lớp ${n}">${n}</button>`).join('')}</div></div>
    <button class="btn" data-act="saveProfile">Lưu</button>`);
  if(s==='rename')return wrap('Đặt tên bạn cú',`<div class="prev">${mascot()}</div><div class="fld"><label for="petName">Tên bạn cú</label><input id="petName" maxlength="16" value="${esc(data.pet)}"></div><button class="btn" data-act="savePet">Lưu tên</button>`);
  if(s==='buddy')return wrap('Đổi bạn đồng hành',`<p style="margin:0;color:var(--muted);font-weight:600">Chọn bạn cú đồng hành cùng bé. Đổi bạn thì cú vẫn giữ nguyên độ lớn.</p>
    <div class="buds">${Object.entries(BUD).map(([k,b])=>{const own=data.buddies.includes(k),on=data.buddy===k;return `<button class="bud ${on?'on':''}" data-act="pickBud" data-arg="${k}">${mascot({stage:Math.max(2,data.stage),buddy:k,wear:{}})}<b>${b.name}</b><small>${on?'Đang đồng hành':'Chọn bạn này'}</small></button>`}).join('')}</div>`);
  if(s==='spin'){
    const can=data.spin!==today(),cols=['#ffb020','#cfe5dd','#f0654d','#e3efea','#ffb020','#cfe5dd','#f0654d','#e3efea'];
    let seg='';PRIZES.forEach((p,i)=>{const a0=(i*45-90-22.5)*Math.PI/180,a1=((i+1)*45-90-22.5)*Math.PI/180,am=(i*45-90)*Math.PI/180;
      seg+=`<path d="M150 150 L${150+140*Math.cos(a0)} ${150+140*Math.sin(a0)} A140 140 0 0 1 ${150+140*Math.cos(a1)} ${150+140*Math.sin(a1)}Z" fill="${cols[i]}" stroke="#fff" stroke-width="3"/><text x="${150+95*Math.cos(am)}" y="${150+95*Math.sin(am)+7}" text-anchor="middle" font-family="Bricolage Grotesque,Be Vietnam Pro,sans-serif" font-weight="800" font-size="${p==='meal'?17:22}" fill="#10242b" transform="rotate(${i*45} ${150+95*Math.cos(am)} ${150+95*Math.sin(am)})">${p==='meal'?'1 bữa':p+'★'}</text>`});
    return wrap('Vòng quay may mắn',`<p style="margin:0;color:var(--muted);font-weight:600">Mỗi ngày được quay 1 lần miễn phí.</p>
    <div class="wheelw"><div class="ptr"></div><svg viewBox="0 0 300 300"><g class="wheel" id="wheel" style="transform:rotate(${S.wrot||0}deg)">${seg}</g><circle cx="150" cy="150" r="22" fill="var(--card)" stroke="#2c2a33" stroke-width="3"/></svg></div>
    <button class="btn" data-act="doSpin" id="spinBtn" ${can?'':'disabled'}>${can?'Quay ngay':'Hôm nay quay rồi, mai quay tiếp nhé'}</button>`);
  }
  return '';
}


/* ===================== HIỂN THỊ ===================== */
function render(){
  applyTheme();
  const v=S.view;
  app.innerHTML=v==='tabs'?vTabs():v==='route'?vRouteView():v==='lesson'?vLesson():v==='quiz'?vQuiz():v==='review'?vReview():vResult();
  layer.innerHTML=vSheet();
  const m=app.querySelector('.main');if(m)m.scrollTop=0;
  const ch=document.querySelector('#rchips .on');if(ch)ch.scrollIntoView({block:'nearest',inline:'center'});
}
function quitQuiz(){
  const Z=S.quiz;
  if(Z&&Z.kind!=='blitz'&&(Z.kind==='exam'||Z.i>0||Z.picked!==null)){if(Z.picked!==null&&Z.kind!=='exam'){Z.i++;Z.picked=null;Z.fv=null}if(Z.kind==='exam'||Z.i<Z.qs.length){Z.id=Z.id||Date.now();data.resume=clone(Z);save()}}
  S.quiz=null;S.view='tabs';render();
}
function onAct(act,arg,el){
  switch(act){
  case 'tab':S.tab=arg;S.resetAsk=false;S.view='tabs';render();break;
  case 'ptab':S.ptab=arg;S.resetAsk=false;render();break;
  case 'ltab':S.ltab=arg;render();break;
  case 'stk':S.stk=arg;render();break;
  case 'route':S.view='route';S.rch=null;render();break;
  case 'rch':S.rch=+arg;render();break;
  case 'rGrade':data.grade=+arg;S.rch=null;save();render();break;
  case 'theme':data.theme=isDark()?'light':'dark';save();render();break;
  case 'profile':S.pg=data.grade;S.sheet='profile';render();break;
  case 'pGrade':{const nm=document.getElementById('pName').value;S.pg=+arg;render();document.getElementById('pName').value=nm;break}
  case 'saveProfile':data.name=document.getElementById('pName').value.trim()||'Bé';data.grade=S.pg||data.grade;S.sheet=null;save();render();toast('Đã lưu hồ sơ');break;
  case 'rename':S.sheet='rename';render();break;
  case 'savePet':data.pet=document.getElementById('petName').value.trim()||'Cú Bông';S.sheet=null;save();render();break;
  case 'close':S.sheet=null;render();break;
  case 'buddy':case 'spin':S.sheet=act;render();break;
  case 'pickBud':{const b=BUD[arg];if(!data.buddies.includes(arg))data.buddies.push(arg);data.buddy=arg;const n=checkStk();save();render();toast(`${b.name} đang đồng hành cùng ${data.name}`+(n.length?` · Sticker mới: ${n[0][2]}`:''));break}
  case 'doSpin':{if(data.spin===today())return;const k=R(0,7),base=Math.ceil((S.wrot||0)/360)*360;S.wrot=base+360*5+(360-k*45);data.spin=today();
    const w=document.getElementById('wheel');el.disabled=true;w.style.transform=`rotate(${S.wrot}deg)`;
    const p=PRIZES[k];let msg;const rr={bonus:0};if(p==='meal'){feed(rr);msg=`Trúng 1 bữa cho ${data.pet}!`+(rr.evolved?` ${data.pet} đã lớn lên!`:'')}else{data.stars+=p;data.earned+=p;msg=`Trúng ${p} ★!`}
    checkStk();save();setTimeout(()=>{render();toast(msg)},matchMedia('(prefers-reduced-motion: reduce)').matches?50:3500);break}
  case 'pet':{const el2=document.getElementById('pet'),bb=document.getElementById('bubble');el2.classList.remove('hop');void el2.offsetWidth;el2.classList.add('hop');bb.textContent=pick(CHEER);break}
  case 'topic':S.topic=arg;S.ltab='note';S.view='lesson';render();break;
  case 'back':S.view='tabs';render();break;
  case 'home':S.view='tabs';S.tab=S.res&&(S.res.kind==='topic'||S.res.kind==='fill'&&S.res.arg)?'hoc':'arena';render();break;
  case 'start':startQuiz('topic',S.topic);break;
  case 'startFill':startQuiz('fill',S.topic);break;
  case 'fillMix':startQuiz('fill');break;
  case 'mix':startQuiz('mix');break;
  case 'exam':startQuiz('exam');break;
  case 'blitz':startQuiz('blitz');break;
  case 'retry':{const r=S.res;if(r.kind==='topic'||r.kind==='fill')S.topic=r.arg;startQuiz(r.kind,r.arg);break}
  case 'review':S.rv=0;S.view='review';render();break;
  case 'rv':S.rv=+arg;render();break;
  case 'backRes':S.view='result';render();break;
  case 'resume':S.quiz=clone(data.resume);S.view='quiz';S.confirm=false;render();break;
  case 'quit':quitQuiz();break;
  case 'setGrade':data.grade=+arg;save();render();break;
  case 'fbToggle':{const b=document.getElementById('fbs'),t=document.getElementById('fbt');b.classList.toggle('min');t.textContent=b.classList.contains('min')?'Xem lời giải':'Thu gọn';break}
  case 'op':{const L=['+','−','×',':'],c=el.dataset.op,n=L[(L.indexOf(c)+1)%4];el.dataset.op=n;el.textContent=n;break}
  case 'fcheck':{const Z=S.quiz,q=Z.qs[Z.i],res=gradeFill(q);Z.fv=res;Z.picked=0;if(res.ok)Z.score++;else Z.wrong.push({q,p:'Bài giải chưa đúng'});render();break}
  case 'ans':{const Z=S.quiz;if(Z.picked!==null)return;Z.picked=+arg;const q=Z.qs[Z.i];if(q.o[Z.picked]===q.a)Z.score++;else Z.wrong.push({q,p:q.o[Z.picked]});render();break}
  case 'next':{const Z=S.quiz;if(Z.i<Z.qs.length-1){Z.i++;Z.picked=null;Z.fv=null;render()}else finish();break}
  case 'eAns':{const Z=S.quiz;Z.ans[Z.i]=Z.qs[Z.i].o[+arg];render();break}
  case 'eGo':S.quiz.i=+arg;S.confirm=false;render();break;
  case 'ePrev':S.quiz.i=Math.max(0,S.quiz.i-1);render();break;
  case 'eNext':S.quiz.i=Math.min(19,S.quiz.i+1);render();break;
  case 'eAsk':S.confirm=true;render();break;
  case 'eCancel':S.confirm=false;render();break;
  case 'eSubmit':finish();break;
  case 'bAns':{const Z=S.quiz;if(Z.lock)return;const q=Z.qs[Z.i],ok=q.o[+arg]===q.a;Z.n++;if(ok)Z.score++;Z.lock=true;el.classList.add(ok?'ok':'bad');
    if(!ok){document.querySelectorAll('#bopts .opt').forEach((b,k)=>{if(q.o[k]===q.a)b.classList.add('ok')})}
    setTimeout(()=>{if(S.quiz!==Z)return;Z.lock=false;Z.i=(Z.i+1)%Z.qs.length;render()},ok?280:700);break}
  case 'saveSettings':data.name=document.getElementById('sName').value.trim()||'Bé';data.grade=+document.getElementById('sGrade').value;data.exam={name:document.getElementById('sExam').value.trim(),date:document.getElementById('sDate').value};save();render();toast('Đã lưu cài đặt');break;
  case 'resetAsk':S.resetAsk=true;render();break;
  case 'resetNo':S.resetAsk=false;render();break;
  case 'resetYes':{const th=data.theme;data=clone(DEF);data.theme=th;save();S.resetAsk=false;S.tab='hoc';S.ptab='prog';render();toast('Đã xoá dữ liệu');break}
  }
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  if(b.dataset.act==='close'&&e.target.closest('[data-stop]')&&!e.target.closest('.x'))return;
  if(b.disabled)return;onAct(b.dataset.act,b.dataset.arg,b);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet){S.sheet=null;render()}});
setInterval(()=>{
  const Z=S.quiz;if(S.view!=='quiz'||!Z||(Z.kind!=='exam'&&Z.kind!=='blitz'))return;
  Z.left--;const t=document.getElementById('tmr');
  if(t){t.textContent=Z.kind==='exam'?mmss(Math.max(0,Z.left)):Math.max(0,Z.left)+'s';t.classList.toggle('low',Z.kind==='exam'?Z.left<120:Z.left<=10)}
  if(Z.left<=0)finish();
},1000);
window.addEventListener('pagehide',()=>{const Z=S.quiz;if(S.view==='quiz'&&Z&&Z.kind==='exam'){Z.id=Z.id||Date.now();data.resume=clone(Z);save()}});
render();
</script>
