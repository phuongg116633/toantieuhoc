<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Luyện Toán lớp 1–5 theo SGK Kết nối tri thức, bộ sách dùng thống nhất toàn quốc">
<meta name="theme-color" content="#fbf7ef">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Toán Tiểu Học 1–5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap&subset=vietnamese">
<style>
/* Phong cách Orbit. Layout: ứng dụng một màn hình (cao 100%, không cuộn trang) — thanh trên, vùng nội dung co giãn, thanh tab cố định dưới */
:root{
  --bg:#fbf7ef; --card:#ffffff; --ink:#10242b; --muted:#4a5e64; --line:#d6e0db; --line-strong:#6b8088; --chip:#e3efea; --mist:#cfe5dd;
  --brand:#0e7c7b; --on-brand:#ffffff; --sun:#ffb020; --on-sun:#10242b; --coral:#f0654d; --on-coral:#10242b; --focus:#0e7c7b;
  --sky1:#e3efea; --sky2:#e3efea; --shell:#fbf4e4; --shell-d:#e6d8bb; --nest:#8a5a34; --nest-d:#6b4224;
  --blue:#0e7c7b; --blue-d:#0e7c7b; --green:#0e7c7b; --green-d:#0e7c7b; --orange:#ffb020; --orange-bg:#fff1d2; --purple:#cfe5dd; --purple-d:#cfe5dd;
  --star:#ffb020; --star-bg:#fff1d2; --flame:#f0654d; --tab-on:#e3efea; --tab-ink:#0e7c7b;
  --ok:#0e7c7b; --ok-bg:#e3efea; --bad:#b3402c; --bad-bg:#fde7e2;
  --g1:#0e7c7b; --g2:#0e7c7b; --g3:#0e7c7b; --g4:#0e7c7b; --g5:#0e7c7b;
  --shadow:0 2px 8px rgba(16,36,43,.08);
  --f-ui:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1d22; --card:#132b32; --ink:#f6efe0; --muted:#a9bdc0; --line:#24404a; --line-strong:#7f9aa2; --chip:#183840; --mist:#2f6a6a;
  --brand:#3fbdb6; --on-brand:#0c1d22; --sun:#ffb020; --on-sun:#0c1d22; --coral:#f0654d; --on-coral:#0c1d22; --focus:#ffb020;
  --sky1:#183840; --sky2:#183840; --shell:#efe6d2; --shell-d:#cbbd9f; --nest:#7a5130; --nest-d:#5a3a20;
  --blue:#3fbdb6; --blue-d:#3fbdb6; --green:#3fbdb6; --green-d:#3fbdb6; --orange:#ffb020; --orange-bg:#3a2f14; --purple:#2f6a6a; --purple-d:#2f6a6a;
  --star:#ffb020; --star-bg:#3a2f14; --flame:#f0654d; --tab-on:#183840; --tab-ink:#3fbdb6;
  --ok:#3fbdb6; --ok-bg:#183840; --bad:#ff8a75; --bad-bg:#3a1f1d;
  --g1:#3fbdb6; --g2:#3fbdb6; --g3:#3fbdb6; --g4:#3fbdb6; --g5:#3fbdb6;
  --shadow:0 2px 8px rgba(0,0,0,.4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c1d22; --card:#132b32; --ink:#f6efe0; --muted:#a9bdc0; --line:#24404a; --line-strong:#7f9aa2; --chip:#183840; --mist:#2f6a6a;
  --brand:#3fbdb6; --on-brand:#0c1d22; --sun:#ffb020; --on-sun:#0c1d22; --coral:#f0654d; --on-coral:#0c1d22; --focus:#ffb020;
  --sky1:#183840; --sky2:#183840; --shell:#efe6d2; --shell-d:#cbbd9f; --nest:#7a5130; --nest-d:#5a3a20;
  --blue:#3fbdb6; --blue-d:#3fbdb6; --green:#3fbdb6; --green-d:#3fbdb6; --orange:#ffb020; --orange-bg:#3a2f14; --purple:#2f6a6a; --purple-d:#2f6a6a;
  --star:#ffb020; --star-bg:#3a2f14; --flame:#f0654d; --tab-on:#183840; --tab-ink:#3fbdb6;
  --ok:#3fbdb6; --ok-bg:#183840; --bad:#ff8a75; --bad-bg:#3a1f1d;
  --g1:#3fbdb6; --g2:#3fbdb6; --g3:#3fbdb6; --g4:#3fbdb6; --g5:#3fbdb6;
  --shadow:0 2px 8px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--f-ui);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
svg{display:block}
.app{position:relative;height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:10px 0;overflow:hidden}
.main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding-bottom:10px}
.main::-webkit-scrollbar{display:none}
.foot{flex:none;display:flex;flex-direction:column;gap:8px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}

/* ---- Thanh trên ---- */
.top{flex:none;display:flex;align-items:center;gap:6px}
.who{display:flex;align-items:center;gap:7px;min-width:0;flex:1 1 auto;max-width:max-content;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;font-family:var(--f-ui);font-weight:700;font-size:16px;box-shadow:var(--shadow)}
.who .av{width:30px;height:30px;flex:none;border-radius:50%;background:var(--sky1);color:var(--blue);display:grid;place-items:center;font-weight:800}
.who .nm{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who svg{flex:none;width:15px;height:15px}
.tr{display:flex;align-items:center;gap:5px;margin-left:auto;flex:none}
.pill{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:5px 9px;font-family:var(--f-ui);font-weight:700;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.2}
.pill svg{width:17px;height:17px;flex:none}
.pill.streak{background:var(--chip);color:var(--muted)}
.pill.streak.on{background:var(--orange-bg);color:var(--flame)}
.pill.stars{background:var(--star-bg)}
.pill.stars svg{color:var(--star)}
.ib{width:38px;height:38px;border-radius:13px;background:var(--chip);display:grid;place-items:center;flex:none;font-size:22px;font-weight:800}
.ib svg{width:19px;height:19px}

/* ---- Khung bầu trời ---- */
.hero{flex:1 1 auto;min-height:250px;position:relative;overflow:hidden;border-radius:26px;background:linear-gradient(180deg,var(--sky1),var(--sky2) 75%);padding:10px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:7px;box-shadow:var(--shadow);isolation:isolate}
.hero::after{content:"";position:absolute;left:-20%;right:-20%;bottom:-80px;height:150px;border-radius:50%;background:var(--grass);z-index:-1;box-shadow:0 -10px 0 var(--grass2) inset}
.sun{position:absolute;right:-30px;top:28%;width:72px;height:72px;border-radius:50%;background:var(--sun);z-index:-1;box-shadow:0 0 0 9px color-mix(in srgb,var(--sun) 25%,transparent)}
.cloud{position:absolute;background:var(--cloud);border-radius:999px;z-index:-1;opacity:.95}
.cloud.c1{left:-30px;top:34%;width:100px;height:36px}
.cloud.c2{right:50px;top:52%;width:90px;height:30px}
.branch{position:absolute;left:24%;top:24%;width:120px;z-index:-1}
.bubble{position:relative;flex:none;align-self:stretch;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:7px 12px;font-family:var(--f-ui);font-weight:600;font-size:15px;line-height:1.3}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--card);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.pet{flex:1 1 0;min-height:70px;width:100%;display:flex;justify-content:center;align-items:flex-end}
.pet svg{height:100%;width:auto;max-width:230px}
.pet.hop svg .body{animation:hop .5s ease}
@keyframes hop{0%,100%{transform:none}40%{transform:translateY(-14px)}}
.pet .egg{animation:wob 2.6s ease-in-out infinite;transform-origin:100px 150px}
@keyframes wob{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-6deg)}90%{transform:rotate(6deg)}95%{transform:rotate(-3deg)}}
.pet .lid{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.petrow{flex:none;display:flex;align-items:center;gap:6px;justify-content:center;margin-top:-4px}
.pname{display:flex;align-items:center;gap:5px;background:var(--card);border-radius:999px;padding:3px 13px;font-family:var(--f-ui);font-weight:800;font-size:19px;box-shadow:var(--shadow)}
.pname svg{width:15px;height:15px;color:var(--orange)}
.stage{background:var(--card);color:var(--green);border-radius:999px;padding:4px 11px;font-family:var(--f-ui);font-weight:700;font-size:13px}
.meal{flex:none;align-self:stretch;background:var(--card);border-radius:14px;padding:6px 12px;display:flex;align-items:center;gap:10px}
.mbar{flex:1;height:11px;border-radius:11px;background:var(--chip);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--star);border-radius:11px;transition:width .4s}
.meal b{font-family:var(--f-ui);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
.meal small{color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap}
.acts{flex:none;display:grid;grid-template-columns:repeat(2,1fr);gap:6px;align-self:stretch}
.acts button{position:relative;background:var(--card);border-radius:999px;padding:6px 4px;font-family:var(--f-ui);font-weight:700;font-size:14px;box-shadow:var(--shadow);white-space:nowrap}
.acts .dot{position:absolute;top:3px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--flame)}

/* ---- Hôm nay ---- */
.todayh{flex:none;display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 2px}
.todayh h2{font-size:20px;font-weight:800;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link{font-family:var(--f-ui);font-weight:800;font-size:15px;color:var(--blue);white-space:nowrap;flex:none}
.tiles{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center;text-align:left;border-radius:16px;padding:9px 10px;color:#fff;min-height:62px;min-width:0}
.tile:active{transform:translateY(2px)}
.tile .ti{grid-row:span 2;width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-family:var(--f-ui);font-weight:800;font-size:19px}
.tile .ti svg{width:20px;height:20px}
.tile b{font-family:var(--f-ui);font-weight:800;font-size:16px;line-height:1.15;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{font-weight:700;font-size:12px;line-height:1.2;opacity:.92;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile.green{background:var(--green);box-shadow:0 4px 0 var(--green-d)}
.tile.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.tile.purple{background:var(--purple);box-shadow:0 4px 0 var(--purple-d)}
.tile.orange{background:var(--orange-bg);color:var(--ink);border:2px solid var(--orange);box-shadow:0 3px 0 color-mix(in srgb,var(--orange) 45%,transparent)}
.tile.orange .ti{background:var(--orange);color:#fff}
.tile.orange b{color:var(--orange)}
.tile.orange small{color:var(--muted);opacity:1}

/* ---- Thanh tab ---- */
.tabs{flex:none;margin-inline:calc(-1 * max(14px,env(safe-area-inset-left,0px))) calc(-1 * max(14px,env(safe-area-inset-right,0px)));background:var(--card);border-top:1.5px solid var(--line);padding:5px 8px calc(5px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px 0;font-family:var(--f-ui);font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}
.tab .tw{width:54px;height:30px;border-radius:999px;display:grid;place-items:center}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--tab-ink)}
.tab.on .tw{background:var(--tab-on)}

/* ---- Thành phần chung ---- */
.bar{flex:none;display:flex;align-items:center;gap:10px}
.bar .ttl{flex:1;min-width:0;font-family:var(--f-ui);font-weight:800;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle{flex:none;font-size:24px;font-weight:800;padding:0 2px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ptitle small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:700}
.card{background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
.card h3{font-size:17px;font-weight:800;margin-bottom:4px}
.sub{color:var(--muted);font-size:13px;font-weight:600}
.btn{display:block;width:100%;border-radius:15px;padding:11px;font-family:var(--f-ui);font-weight:800;font-size:18px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d);text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.btn.sec2{background:var(--chip);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.red{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 60%,#000)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{flex:none;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--chip);border-radius:14px;padding:4px}
.seg button{border-radius:11px;padding:7px 4px;font-family:var(--f-ui);font-weight:800;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.chips{flex:none;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border-radius:999px;padding:6px 13px;background:var(--chip);font-family:var(--f-ui);font-weight:800;font-size:14px;white-space:nowrap}
.chips button.on{background:var(--gc,var(--blue));color:#fff}
.gpick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.gpick button{height:44px;border-radius:13px;background:var(--chip);font-family:var(--f-ui);font-weight:800;font-size:20px}
.gpick button.on{background:var(--gc,var(--blue));color:#fff}
.st{flex:none;font-size:14px;letter-spacing:1px;color:var(--line)}
.st i{font-style:normal;color:var(--star)}

/* ---- Lộ trình ---- */
.chapc{display:flex;flex-direction:column;gap:6px}
.chapc h3{font-size:17px;color:var(--gc)}
.chapc h3 em{display:block;font-style:normal;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:var(--f-body);font-weight:800}
.trow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border:2px solid var(--line);border-radius:14px;min-height:50px;background:var(--card)}
.trow:active{background:var(--chip)}
.trow>span:first-child{flex:1;min-width:0;font-weight:700;line-height:1.25;font-size:15px}

/* ---- Đấu trường ---- */
.mode{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:10px 12px}
.mode .ti{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;color:#fff}
.mode .ti svg{width:24px;height:24px}
.mode b{display:block;font-family:var(--f-ui);font-weight:800;font-size:17px;line-height:1.15}
.mode small{display:block;color:var(--muted);font-weight:600;font-size:12.5px;line-height:1.25}
.mode>span:last-child{min-width:0}
.banner{display:flex;align-items:center;gap:10px;background:var(--orange-bg);border:2px solid var(--orange);border-radius:16px;padding:8px 12px}
.banner .num{width:40px;height:40px;flex:none;border-radius:12px;background:var(--orange);color:#fff;display:grid;place-items:center;font-family:var(--f-ui);font-weight:800;font-size:20px}
.banner b{font-family:var(--f-ui);color:var(--orange);font-size:16px;display:block;line-height:1.2}

/* ---- Sticker ---- */
.stk{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.sk{aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;font-size:clamp(20px,6.5vw,30px);background:var(--sky1);border:3px solid transparent}
.sk.off{background:var(--chip);filter:grayscale(1);opacity:.4}
.sk.sel{border-color:var(--orange);opacity:1}
.skd{display:flex;gap:12px;align-items:center}
.skd .ci{width:64px;height:64px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:34px;background:var(--sky1)}
.skd.off .ci{background:var(--chip);filter:grayscale(1);opacity:.5}
.skd b{font-family:var(--f-ui);font-size:19px;display:block}

/* ---- Phụ huynh ---- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{background:var(--chip);border-radius:14px;padding:7px;text-align:center}
.stat b{display:block;font-family:var(--f-ui);font-size:22px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-weight:700;font-size:11px;line-height:1.2;display:block}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:90px;margin-top:6px}
.bars div{display:flex;flex-direction:column;align-items:center;gap:2px;height:100%;justify-content:flex-end;font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.bars i{display:block;width:100%;max-width:26px;border-radius:7px 7px 3px 3px;background:var(--green);min-height:3px}
.bars .today i{background:var(--orange)}
.mrow{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1.5px solid var(--line)}
.mrow:first-of-type{border-top:0}
.mrow span{flex:1;min-width:0;font-weight:700;font-size:13.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .mb{width:70px;height:7px;border-radius:7px;background:var(--chip);overflow:hidden;flex:none}
.mrow .mb i{display:block;height:100%;background:var(--gc)}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-weight:800;font-size:13px;color:var(--muted)}
.fld input,.fld select{font:inherit;font-weight:700;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:8px 10px;width:100%;min-width:0}
.confirm{background:var(--orange-bg);border:2px solid var(--orange);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;font-weight:700}
.phone{font-family:var(--f-ui);font-weight:800;font-size:30px;letter-spacing:.02em;user-select:all;font-variant-numeric:tabular-nums}

/* ---- Bài học / làm bài ---- */
.prog{flex:1;height:11px;border-radius:11px;background:var(--chip);overflow:hidden}
.prog i{display:block;height:100%;background:var(--gc);border-radius:11px;transition:width .3s}
.tmr{font-family:var(--f-ui);font-weight:800;font-size:16px;background:var(--orange-bg);color:var(--orange);border-radius:999px;padding:3px 11px;font-variant-numeric:tabular-nums;flex:none}
.tmr.low{background:var(--bad-bg);color:var(--bad)}
.meta{font-weight:700;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;flex:none}
.note{background:var(--card);border-radius:18px;padding:14px 14px 14px 36px;position:relative;box-shadow:var(--shadow)}
.note::before,.qcard::before,.sol::before{content:"";position:absolute;left:22px;top:0;bottom:0;width:2px;background:#f2a7a7}

<script>

/* ===================== TIỆN ÍCH ===================== */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[R(0,a.length-1)];
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>b?gcd(b,a%b):a;
const lcm=(a,b)=>a*b/gcd(a,b);
const NB=' ';
function f(n){ // định dạng số kiểu Việt Nam: 12 345,67
  n=+(+n).toFixed(6);const neg=n<0;n=Math.abs(n);
  let [i,d]=String(n).split('.');
  if(i.length>4||(i.length===4&&!d))i=i.replace(/\B(?=(\d{3})+(?!\d))/g,NB);
  return (neg?'−':'')+i+(d?','+d:'');
}
const E=s=>`<span class="eq">${s}</span>`;
const U=(x,u)=>u?(u==='%'?f(x)+'%':f(x)+' '+u):f(x);
function nq(q,ans,e,c=[],v='',u=''){
  ans=+(+ans).toFixed(6);
  const dec=(String(ans).split('.')[1]||'').length, st=Math.pow(10,-dec);
  const near=[ans+st,ans-st,ans+2*st,ans-2*st,ans+10*st,ans-10*st,ans+3*st].map(x=>+x.toFixed(dec));
  const pool=[...shuf(c.map(x=>+(+x).toFixed(6))),...shuf(near)];
  const out=[];
  for(const x of pool){if(!isFinite(x)||x<0||x===ans||out.includes(x))continue;out.push(x);if(out.length===3)break}
  return {q,a:U(ans,u),o:shuf([ans,...out]).map(x=>U(x,u)),e,v};
}
function ch(q,a,others,e,v=''){
  const o=[];for(const x of shuf(others)){if(x!==a&&!o.includes(x)){o.push(x);if(o.length===3)break}}
  return {q,a,o:shuf([a,...o]),e,v};
}
const fs=(n,d)=>{const g=gcd(n,d);n/=g;d/=g;return d===1?String(n):n+'/'+d};
function fq(q,n,d,cands,e,v=''){
  const a=fs(n,d),seen=[n/d],o=[];
  for(const [x,y] of shuf(cands)){if(!(y>0)||x<0||!Number.isInteger(x)||!Number.isInteger(y))continue;const vv=x/y;if(seen.some(s=>Math.abs(s-vv)<1e-9))continue;seen.push(vv);o.push(fs(x,y));if(o.length===3)break}
  let k=1;while(o.length<3){const vv=(n*k+d)/(d*k);const x=n+k,y=d+ (k%2);const w=x/y;if(!seen.some(s=>Math.abs(s-w)<1e-9)){seen.push(w);o.push(fs(x,y))}k++}
  return {q,a,o:shuf([a,...o]),e,v};
}
const D=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
function triad(n,full){
  const h=Math.floor(n/100),t=Math.floor(n/10)%10,u=n%10,w=[];
  if(full||h)w.push(D[h]+' trăm');
  if(t===0){if(u&&(full||h))w.push('linh')}
  else w.push(t===1?'mười':D[t]+' mươi');
  if(u)w.push(u===1&&t>1?'mốt':u===5&&t>0?'lăm':D[u]);
  return w.join(' ');
}
function readVN(n){
  if(n===0)return 'không';
  const units=['','nghìn','triệu','tỉ'],gs=[];
  while(n>0){gs.push(n%1000);n=Math.floor(n/1000)}
  const p=[];
  for(let k=gs.length-1;k>=0;k--){if(!gs[k])continue;p.push(triad(gs[k],k<gs.length-1)+(units[k]?' '+units[k]:''))}
  return p.join(' ');
}
function roman(n){const m=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let s='';for(const [v,r] of m)while(n>=v){s+=r;n-=v}return s}
function swapD(n){const s=String(n).split('');for(let t=0;t<20;t++){const i=R(0,s.length-2);if(s[i]!==s[i+1]&&!(i===0&&s[i+1]==='0')){[s[i],s[i+1]]=[s[i+1],s[i]];return +s.join('')}}return n+Math.pow(10,R(0,String(n).length-1))}

/* ===================== HÌNH VẼ ===================== */
function clock(h,m){
  let s='<svg class="clock" viewBox="0 0 120 120" role="img" aria-label="Mặt đồng hồ"><circle cx="60" cy="60" r="55" class="cf"/>';
  for(let i=1;i<=12;i++){const a=i*Math.PI/6;s+=`<text x="${(60+43*Math.sin(a)).toFixed(1)}" y="${(64-43*Math.cos(a)).toFixed(1)}" text-anchor="middle" class="cn">${i}</text>`}
  const ha=((h%12)+m/60)*Math.PI/6, ma=m*Math.PI/30;
  s+=`<line x1="60" y1="60" x2="${(60+25*Math.sin(ha)).toFixed(1)}" y2="${(60-25*Math.cos(ha)).toFixed(1)}" class="hh"/><line x1="60" y1="60" x2="${(60+37*Math.sin(ma)).toFixed(1)}" y2="${(60-37*Math.cos(ma)).toFixed(1)}" class="mh"/><circle cx="60" cy="60" r="4" class="cc"/></svg>`;
  return s;
}

function angleSvg(d){
  const vx=110,vy=105,L=85,r=d*Math.PI/180,x2=vx+L*Math.cos(r),y2=vy-L*Math.sin(r);
  let mk;
  if(d===90)mk=`<path d="M${vx+16} ${vy} V${vy-16} H${vx}" class="am"/>`;
  else{const rr=22;mk=`<path d="M${vx+rr} ${vy} A${rr} ${rr} 0 0 0 ${(vx+rr*Math.cos(r)).toFixed(1)} ${(vy-rr*Math.sin(r)).toFixed(1)}" class="am"/>`}
  return `<svg class="ang" viewBox="0 0 220 126" role="img" aria-label="Góc"><line x1="${vx}" y1="${vy}" x2="${vx+L}" y2="${vy}" class="ar"/><line x1="${vx}" y1="${vy}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" class="ar"/>${mk}<circle cx="${vx}" cy="${vy}" r="4" class="av"/></svg>`;
}
function rectSvg(a,b,u='cm'){
  const W=Math.min(200,40+a*10),H=Math.min(110,24+b*8),x=(240-W)/2,y=(130-H)/2;
  return `<svg class="rect" viewBox="0 0 240 150" role="img" aria-label="Hình"><rect x="${x}" y="${y}" width="${W}" height="${H}" class="rf"/><text x="120" y="${y+H+18}" text-anchor="middle">${a} ${u}</text><text x="${x-6}" y="${y+H/2+4}" text-anchor="end">${b} ${u}</text></svg>`;
}

  {id:'2i',t:'Đọc, viết, so sánh số có ba chữ số',note:'Số 305 gồm 3 trăm, 0 chục, 5 đơn vị, đọc là "ba trăm linh năm". So sánh từ hàng trăm, đến hàng chục, rồi hàng đơn vị.',
   g:()=>{const n=R(101,999),h=Math.floor(n/100),t=Math.floor(n/10)%10,u=n%10,k=R(0,2);
     if(k===0)return nq(`Số gồm ${h} trăm, ${t} chục và ${u} đơn vị là:`,n,`${h} trăm = ${h*100}, ${t} chục = ${t*10}. ${h*100} + ${t*10} + ${u} = ${n}.`,[h*100+u*10+t,h*10+t+u,n+100]);
     if(k===1)return nq(`Số "${readVN(n)}" viết là:`,n,`Viết lần lượt chữ số hàng trăm (${h}), hàng chục (${t}), hàng đơn vị (${u}): ${n}.`,[h*100+u*10+t,swapD(n),h*100+t*10+(u+1)%10]);
     const s=new Set();while(s.size<4)s.add(R(Math.max(100,n-90),Math.min(999,n+90)));const a=[...s],big=Math.random()<.5,ans=String(big?Math.max(...a):Math.min(...a));
     return ch(`Số ${big?'lớn':'bé'} nhất trong các số ${a.join(', ')} là:`,ans,a.map(String),`So sánh lần lượt hàng trăm, hàng chục, hàng đơn vị. Số ${big?'lớn':'bé'} nhất là ${ans}.`)}}
 ]},
 {t:'Độ dài và đơn vị đo độ dài',tp:[
  {id:'2k',t:'m, dm, cm, km',note:'1 m = 10 dm = 100 cm. 1 dm = 10 cm. 1 km = 1000 m.',
   g:()=>{const [a,b,k]=pick([['m','dm',10],['dm','cm',10],['m','cm',100],['km','m',1000]]),x=R(1,9);return nq(`${x} ${a} = ? ${b}`,x*k,`1 ${a} = ${k} ${b}, nên ${x} ${a} = ${x} × ${k} = ${x*k} ${b}.`,[x*k*10,x*k/10,x+k],'',b)}}
 ]},
 {t:'Phép cộng, phép trừ trong phạm vi 1000',tp:[
  {id:'2l',t:'Cộng, trừ số có ba chữ số',note:'Đặt tính thẳng hàng: trăm thẳng trăm, chục thẳng chục, đơn vị thẳng đơn vị. Tính từ phải sang trái, nhớ đúng.',
   g:()=>{if(R(0,1)){const a=R(100,700),b=R(100,999-a);return nq(E(`${a} + ${b} = ?`),a+b,`Đặt tính rồi cộng từ hàng đơn vị: ${a} + ${b} = ${a+b}.`,[a+b+10,a+b-10,a+b+100])}
     const a=R(300,999),b=R(100,a-50);return nq(E(`${a} − ${b} = ?`),a-b,`Đặt tính rồi trừ từ hàng đơn vị: ${a} − ${b} = ${a-b}.`,[a-b+10,a-b-10,a-b+100])}}
 ]}
]},
{n:3,c:'--g3',sub:'Bảng nhân chia · Chu vi, diện tích · Số đến 100 000',chap:[
 {t:'Bảng nhân, bảng chia',tp:[
  {id:'3a',t:'Bảng nhân 3 đến 9',note:'Học thuộc bảng nhân. Mẹo: đổi chỗ các thừa số thì tích không đổi, ví dụ 7 × 4 = 4 × 7 = 28.',
   g:()=>{const k=R(3,9),n=R(1,10);return nq(E(`${k} × ${n} = ?`),k*n,`${k} × ${n} = ${k*n}.`,[k*n+k,k*n-k,k*(n+1)+1,k+n])}},
  {id:'3b',t:'Bảng chia 3 đến 9',note:'Muốn tìm thương, nhẩm xem số chia nhân với mấy thì được số bị chia. Vì 6 × 4 = 24 nên 24 : 6 = 4.',
   g:()=>{const k=R(3,9),n=R(1,10);return nq(E(`${k*n} : ${k} = ?`),n,`Vì ${k} × ${n} = ${k*n} nên ${k*n} : ${k} = ${n}.`,[n+1,n-1,n+2])}},
  {id:'3c',t:'Một phần mấy của một số',note:'Muốn tìm 1/3 của một số, ta lấy số đó chia cho 3. Ví dụ: 1/3 của 12 là 12 : 3 = 4.',
   g:()=>{const k=R(2,9),m=R(2,9),n=k*m,[w,u]=pick([['',''],['quả cam','quả'],['kg','kg'],['m','m']]);
     return nq(w&&w!=='quả cam'?`1/${k} của ${n} ${w} là:`:w?`Có ${n} quả cam. 1/${k} số cam là bao nhiêu quả?`:`1/${k} của ${n} là:`,m,`Lấy ${n} : ${k} = ${m}.`,[n-k,m+1,k],'',u)}}
 ]},
 {t:'Phép nhân, phép chia trong phạm vi 1000',tp:[
  {id:'3d',t:'Nhân, chia với số có một chữ số',note:'Nhân, chia số có nhiều chữ số với số có một chữ số: đặt tính rồi tính. Phép nhân tính từ phải sang trái, phép chia tính từ trái sang phải.',
   g:()=>{const k=R(2,9);if(R(0,1)){const a=R(12,Math.floor(999/k));return nq(E(`${a} × ${k} = ?`),a*k,`Đặt tính: ${a} × ${k} = ${a*k}.`,[a*k+k,a*k-10,a*k+10])}
     const q=R(12,Math.floor(999/k)),a=q*k;return nq(E(`${a} : ${k} = ?`),q,`Thử lại: ${q} × ${k} = ${a}. Vậy ${a} : ${k} = ${q}.`,[q+10,q-10,q+1])}},
  {id:'3e',t:'Phép chia có dư',note:'Trong phép chia có dư, số dư luôn bé hơn số chia. Ví dụ: 17 : 5 = 3 (dư 2).',
   g:()=>{const k=R(3,9),q=R(2,12),r=R(1,k-1),a=q*k+r;return nq(`Phép chia ${a} : ${k} có số dư là:`,r,`${a} : ${k} = ${q} (dư ${r}), vì ${q} × ${k} = ${q*k} và ${a} − ${q*k} = ${r}. Số dư ${r} bé hơn số chia ${k}.`,[r+1,r-1,k,q])}},
  {id:'3f',t:'Tính giá trị biểu thức',note:'Có nhân, chia và cộng, trừ thì làm nhân, chia trước; cộng, trừ sau. Có dấu ngoặc ( ) thì tính trong ngoặc trước.',
   g:()=>{const t=R(0,3);
     if(t===0){const a=R(10,90),b=R(2,9),c=R(2,9);return nq(E(`${a} + ${b} × ${c}`),a+b*c,`Nhân trước: ${b} × ${c} = ${b*c}. Rồi cộng: ${a} + ${b*c} = ${a+b*c}.`,[(a+b)*c,a+b+c])}
     if(t===1){const a=R(2,20),b=R(2,20),c=R(2,5);return nq(E(`(${a} + ${b}) × ${c}`),(a+b)*c,`Trong ngoặc trước: ${a} + ${b} = ${a+b}. Rồi nhân: ${a+b} × ${c} = ${(a+b)*c}.`,[a+b*c,a+b+c])}
     if(t===2){const c=R(2,9),q=R(2,9),b=c*q,a=R(b+5,99);return nq(E(`${a} − ${b} : ${c}`),a-q,`Chia trước: ${b} : ${c} = ${q}. Rồi trừ: ${a} − ${q} = ${a-q}.`,[Number.isInteger((a-b)/c)?(a-b)/c:a-b,a-q+10,a+q])}
     const a=R(2,9),b=R(10,30),c=R(1,a*b-1);return nq(E(`${a} × ${b} − ${c}`),a*b-c,`Nhân trước: ${a} × ${b} = ${a*b}. Rồi trừ: ${a*b} − ${c} = ${a*b-c}.`,[b>c?a*(b-c):a*b+c,a*b-c+10])}}
 ]},
 {t:'Đơn vị đo lường',tp:[
  {id:'3g',t:'mm, g, ml',note:'1 cm = 10 mm. 1 m = 1000 mm. 1 kg = 1000 g. 1 l = 1000 ml.',
   g:()=>{if(Math.random()<.3){const k=R(1,4),g=R(1,9)*100;return nq(`${k} kg ${g} g = ? g`,k*1000+g,`${k} kg = ${f(k*1000)} g. ${f(k*1000)} g + ${g} g = ${f(k*1000+g)} g.`,[k+g,k*100+g,k*1000+g*10],'','g')}
     const [a,b,k]=pick([['cm','mm',10],['m','mm',1000],['kg','g',1000],['l','ml',1000]]),x=R(1,9);return nq(`${x} ${a} = ? ${b}`,x*k,`1 ${a} = ${f(k)} ${b}, nên ${x} ${a} = ${f(x*k)} ${b}.`,[x*k*10,x*k/10,x*100],'',b)}},
  {id:'3h',t:'Tiền Việt Nam',note:'Các tờ tiền thường gặp: 1 000, 2 000, 5 000, 10 000, 20 000, 50 000, 100 000 đồng. Tiền trả lại = tiền đưa − tiền hàng.',
   g:()=>{const a=R(2,9)*1000,b=R(2,9)*1000,pay=a+b<=20000?20000:50000;return nq(`Mẹ mua một quyển vở giá ${f(a)} đồng và một cây bút giá ${f(b)} đồng. Mẹ đưa cô bán hàng ${f(pay)} đồng. Cô trả lại bao nhiêu tiền?`,pay-a-b,`Tiền hàng: ${f(a)} + ${f(b)} = ${f(a+b)} (đồng). Trả lại: ${f(pay)} − ${f(a+b)} = ${f(pay-a-b)} (đồng).`,[a+b,pay-a,pay-a-b+1000,pay-a-b-1000],'','đồng')}}
 ]},
 {t:'Chu vi, diện tích',tp:[
  {id:'3i',t:'Chu vi, diện tích hình chữ nhật, hình vuông',note:'Hình chữ nhật: Chu vi = (dài + rộng) × 2; Diện tích = dài × rộng. Hình vuông: Chu vi = cạnh × 4; Diện tích = cạnh × cạnh. Đơn vị diện tích: cm².',
   g:()=>{const sq=Math.random()<.4,cv=R(0,1);
     if(sq){const a=R(2,12);return cv?nq(`Hình vuông có cạnh ${a} cm. Chu vi hình vuông là:`,a*4,`Chu vi = ${a} × 4 = ${a*4} (cm).`,[a*a,a*2,a+4],rectSvg(a,a),'cm'):nq(`Hình vuông có cạnh ${a} cm. Diện tích hình vuông là:`,a*a,`Diện tích = ${a} × ${a} = ${a*a} (cm²).`,[a*4,a*2,a*a+a],rectSvg(a,a),'cm²')}
     const a=R(5,15),b=R(2,a-1);return cv?nq(`Hình chữ nhật có chiều dài ${a} cm, chiều rộng ${b} cm. Chu vi là:`,(a+b)*2,`Chu vi = (${a} + ${b}) × 2 = ${(a+b)*2} (cm).`,[a*b,a+b,(a+b)*2+2],rectSvg(a,b),'cm'):nq(`Hình chữ nhật có chiều dài ${a} cm, chiều rộng ${b} cm. Diện tích là:`,a*b,`Diện tích = ${a} × ${b} = ${a*b} (cm²).`,[(a+b)*2,a+b,a*b+a],rectSvg(a,b),'cm²')}}
 ]},
 {t:'Các số đến 100 000',tp:[
  {id:'3k',t:'Đọc, viết, làm tròn số',note:'Làm tròn đến hàng nghìn: nhìn chữ số hàng trăm, nếu bé hơn 5 thì làm tròn xuống, từ 5 trở lên thì làm tròn lên.',
   g:()=>{const k=R(0,2);
     if(k===0){const n=Math.random()<.4?R(2,99)*1000-1:R(1000,99998),nx=R(0,1);return nx?nq(`Số liền sau của ${f(n)} là:`,n+1,`${f(n)} + 1 = ${f(n+1)}.`,[n-1,n+10,n+1000]):nq(`Số liền trước của ${f(n)} là:`,n-1,`${f(n)} − 1 = ${f(n-1)}.`,[n+1,n-10,n-1000])}
     if(k===1){const n=R(1001,99499),hr=Math.random()<.5,s=hr?1000:100,r=Math.round(n/s)*s;return nq(`Làm tròn số ${f(n)} đến hàng ${hr?'nghìn':'trăm'} ta được:`,r,`Chữ số hàng ${hr?'trăm':'chục'} là ${Math.floor(n/(s/10))%10} ${Math.floor(n/(s/10))%10>=5?'≥ 5 nên làm tròn lên':'< 5 nên làm tròn xuống'}: ${f(r)}.`,[Math.floor(n/s)*s===r?r+s:r-s,Math.round(n/(s/10))*(s/10),Math.round(n/(s*10))*s*10])}
     const n=R(10000,99999),s=String(n);let p;do{p=R(0,4)}while(s[4-p]==='0');const d=+s[4-p],v=d*Math.pow(10,p);return nq(`Trong số ${f(n)}, chữ số ở hàng ${HANG[p]} có giá trị là:`,v,`Chữ số hàng ${HANG[p]} là ${d}, có giá trị ${f(v)}.`,[d,v*10,v/10].filter(Number.isInteger))}},
  {id:'3l',t:'Chữ số La Mã',note:'I = 1, V = 5, X = 10. Chữ số nhỏ đứng bên phải thì cộng thêm (VI = 6), đứng bên trái thì trừ đi (IV = 4).',
   g:()=>{const n=R(1,20);if(R(0,1))return nq(`Số La Mã ${roman(n)} có giá trị là:`,n,`${roman(n)} = ${n}.`,[n===4?6:n===6?4:n===9?11:n===11?9:n+5,n+1,n-1]);
     return ch(`Số ${n} viết bằng chữ số La Mã là:`,roman(n),[roman(n+1),roman(Math.max(1,n-1)),n===4?'IIII':n===9?'VIIII':roman(n+5),n>10?'X'+roman(n-9):roman(n+10)],`${n} = ${roman(n)}.`)}}
 ]}
]},
{n:4,c:'--g4',sub:'Lớp triệu · Phân số · Góc · Trung bình cộng',chap:[
 {t:'Số tự nhiên',tp:[
  {id:'4a',t:'Số có nhiều chữ số, lớp triệu',note:'Mỗi lớp có ba hàng: lớp đơn vị (đơn vị, chục, trăm), lớp nghìn, lớp triệu. Đọc số theo từng lớp từ trái sang phải.',
   g:()=>{const k=R(0,2);
     if(k===0){const n=R(1,999)*1e6+R(0,999)*1e3+R(0,999);return nq(`Số "${readVN(n)}" viết là:`,n,`Viết lần lượt từng lớp: lớp triệu, lớp nghìn, lớp đơn vị → ${f(n)}.`,[swapD(n),swapD(n),Math.floor(n/1e6)*1e5+n%1e5])}
     if(k===1){const n=R(1e6,999999999),s=String(n),L=s.length;let p;do{p=R(0,L-1)}while(s[L-1-p]==='0');const d=+s[L-1-p],v=d*Math.pow(10,p);return nq(`Trong số ${f(n)}, chữ số ở hàng ${HANG[p]} có giá trị là:`,v,`Chữ số hàng ${HANG[p]} là ${d}, có giá trị ${f(v)}.`,[d,v*10,v/10].filter(Number.isInteger))}
     const n=R(1e6,99e6),r=Math.round(n/1e5)*1e5;return nq(`Làm tròn số ${f(n)} đến hàng trăm nghìn ta được:`,r,`Chữ số hàng chục nghìn là ${Math.floor(n/1e4)%10} ${Math.floor(n/1e4)%10>=5?'≥ 5 nên làm tròn lên':'< 5 nên làm tròn xuống'}: ${f(r)}.`,[r===Math.floor(n/1e5)*1e5?r+1e5:r-1e5,Math.round(n/1e6)*1e6,Math.round(n/1e4)*1e4])}}
 ]},
 {t:'Các phép tính với số tự nhiên',tp:[
  {id:'4b',t:'Cộng, trừ, nhân, chia số có nhiều chữ số',note:'Nhân với số có hai chữ số: tích riêng thứ hai viết lùi sang trái một cột. Chia cho số có hai chữ số: ước lượng thương từng bước.',
   g:()=>{const t=R(0,3);
     if(t===0){const a=R(10000,99999),b=R(10000,99999);return nq(E(`${f(a)} + ${f(b)}`),a+b,`Đặt tính rồi cộng từ phải sang trái: ${f(a+b)}.`,[a+b-1000,a+b+100,a+b-10])}
     if(t===1){const a=R(50000,99999),b=R(10000,a-1000);return nq(E(`${f(a)} − ${f(b)}`),a-b,`Đặt tính rồi trừ từ phải sang trái: ${f(a-b)}.`,[a-b+1000,a-b-100,a-b+10])}
     if(t===2){const a=R(100,999),b=R(11,99);return nq(E(`${a} × ${b}`),a*b,`Tích riêng thứ nhất: ${a} × ${b%10} = ${f(a*(b%10))}. Tích riêng thứ hai: ${a} × ${Math.floor(b/10)} = ${f(a*Math.floor(b/10))} (viết lùi một cột). Cộng lại: ${f(a*b)}.`,[a*(b%10)+a*Math.floor(b/10),a*b+a,a*b-10])}
     const b=R(11,99),q=R(11,199),a=b*q;return nq(E(`${f(a)} : ${b}`),q,`Thử lại: ${q} × ${b} = ${f(a)}.`,[q+10,q-1,q+1])}},
  {id:'4c',t:'Tìm số trung bình cộng',note:'Muốn tìm trung bình cộng của nhiều số, ta tính tổng các số đó rồi chia cho số các số hạng.',
   g:()=>{const k=R(3,4),avg=R(20,90);let a;do{a=Array.from({length:k-1},()=>avg+R(-15,15));a.push(avg*k-a.reduce((x,y)=>x+y,0))}while(a[k-1]<=0);const s=avg*k;return nq(`Trung bình cộng của các số ${a.join('; ')} là:`,avg,`Tổng: ${a.join(' + ')} = ${s}. Trung bình cộng: ${s} : ${k} = ${avg}.`,[s,Math.round(s/(k+1)),avg+1,avg-2])}},
  {id:'4d',t:'Tìm hai số khi biết tổng và hiệu',note:'Số lớn = (Tổng + Hiệu) : 2. Số bé = (Tổng − Hiệu) : 2.',
   g:()=>{const sm=R(10,200),bg=sm+R(4,100),S=sm+bg,Dd=bg-sm,big=R(0,1);
     if(Math.random()<.35){const c=R(5,12),p=c+R(22,32);return nq(`Tuổi bố và tuổi con cộng lại là ${p+c} tuổi. Bố hơn con ${p-c} tuổi. Con bao nhiêu tuổi?`,c,`Tuổi con = (${p+c} − ${p-c}) : 2 = ${c} (tuổi).`,[p,p-c,(p+c)/2|0],'','tuổi')}
     return nq(`Tổng hai số là ${S}, hiệu hai số là ${Dd}. Số ${big?'lớn':'bé'} là:`,big?bg:sm,big?`Số lớn = (${S} + ${Dd}) : 2 = ${bg}.`:`Số bé = (${S} − ${Dd}) : 2 = ${sm}.`,[big?sm:bg,S-Dd,(S/2)|0])}}
 ]},
 {t:'Góc và đơn vị đo góc',tp:[
  {id:'4e',t:'Góc nhọn, góc vuông, góc tù, góc bẹt',note:'Góc vuông = 90°. Góc nhọn bé hơn góc vuông. Góc tù lớn hơn góc vuông nhưng bé hơn góc bẹt. Góc bẹt = 180°.',
   g:()=>{const t=R(0,3),d=[R(3,8)*10,90,R(10,16)*10,180][t],nm=['Góc nhọn','Góc vuông','Góc tù','Góc bẹt'][t];return ch(`Góc trong hình có số đo ${d}°. Đó là góc gì?`,nm,['Góc nhọn','Góc vuông','Góc tù','Góc bẹt'],t===0?`${d}° < 90° nên là góc nhọn.`:t===1?'Góc 90° là góc vuông.':t===2?`90° < ${d}° < 180° nên là góc tù.`:'Góc 180° là góc bẹt: hai cạnh nằm trên một đường thẳng.',angleSvg(d))}}
 ]},
 {t:'Đơn vị đo đại lượng',tp:[
  {id:'4f',t:'Yến, tạ, tấn · giây, thế kỉ · m², dm²',note:'1 yến = 10 kg; 1 tạ = 100 kg; 1 tấn = 1000 kg. 1 phút = 60 giây; 1 thế kỉ = 100 năm. 1 m² = 100 dm²; 1 dm² = 100 cm².',
   g:()=>{if(Math.random()<.25){const y=R(1001,2099),c=Math.ceil(y/100);return ch(`Năm ${y} thuộc thế kỉ nào?`,'Thế kỉ '+roman(c),['Thế kỉ '+roman(c-1),'Thế kỉ '+roman(c+1),'Thế kỉ '+roman(Math.floor(y/100)+(c===Math.floor(y/100)?1:-1)),'Thế kỉ '+roman(c+2)],`Từ năm ${(c-1)*100+1} đến năm ${c*100} là thế kỉ ${roman(c)} (thế kỉ ${c}).`)}
     const [a,b,k]=pick([['tấn','kg',1000],['tạ','kg',100],['yến','kg',10],['phút','giây',60],['thế kỉ','năm',100],['m²','dm²',100],['dm²','cm²',100],['giờ','phút',60]]),x=R(2,9);return nq(`${x} ${a} = ? ${b}`,x*k,`1 ${a} = ${k} ${b}, nên ${x} ${a} = ${x} × ${k} = ${f(x*k)} ${b}.`,[x*k*10,x*k/10,x+k,x*100===x*k?x*10:x*100],'',b)}}
 ]},
 {t:'Phân số',tp:[
  {id:'4g',t:'Rút gọn, so sánh phân số',note:'Rút gọn: chia cả tử số và mẫu số cho cùng một số lớn hơn 1. So sánh: quy đồng mẫu số rồi so sánh tử số.',
   g:()=>{if(R(0,1)){let a,b;do{b=R(2,9);a=R(1,b-1)}while(gcd(a,b)!==1);const m=R(2,6);return fq(`Rút gọn phân số ${a*m}/${b*m} ta được:`,a,b,[[a,b*m],[a*m,b],[a+1,b],[a,b+1],[b,a]],`Chia cả tử và mẫu cho ${m}: ${a*m} : ${m} = ${a}; ${b*m} : ${m} = ${b}. Được ${a}/${b}.`)}
     const b=R(2,9),d=R(2,9),a=R(1,b+2),c=R(1,d+2),L=lcm(b,d),x=a*L/b,y=c*L/d,s=x>y?'>':x<y?'<':'=';return ch(`Chọn dấu thích hợp:${E(`${a}/${b} ☐ ${c}/${d}`)}`,s,['>','<','='],b===d?`Cùng mẫu số, so sánh tử số: ${a} ${s} ${c}.`:`Quy đồng: ${a}/${b} = ${x}/${L}; ${c}/${d} = ${y}/${L}. Vì ${x} ${s} ${y} nên ${a}/${b} ${s} ${c}/${d}.`)}}
 ]},
 {t:'Các phép tính với phân số',tp:[
  {id:'4h',t:'Cộng, trừ phân số',note:'Cùng mẫu số: cộng (trừ) các tử số, giữ nguyên mẫu số. Khác mẫu số: quy đồng mẫu số trước. Kết quả nên rút gọn.',
   g:()=>{let b=R(2,9),d=b*R(1,3),a=R(1,b-1),c=R(1,d-1);const ad=a*d/b,add=R(0,1);
     if(add)return fq(E(`${a}/${b} + ${c}/${d}`),ad+c,d,[[a+c,b+d],[a+c,d],[ad+c+1,d],[a*c,b*d]],b===d?`Cùng mẫu: ${a} + ${c} = ${a+c}, được ${a+c}/${d} = ${fs(a+c,d)}.`:`Quy đồng: ${a}/${b} = ${ad}/${d}. ${ad}/${d} + ${c}/${d} = ${ad+c}/${d} = ${fs(ad+c,d)}.`);
     if(ad===c){c=c>1?c-1:c;if(ad===c)return fq(E(`${a}/${b} + ${c}/${d}`),ad+c,d,[[a+c,b+d],[a+c,d],[ad+c+1,d]],`Quy đồng rồi cộng tử số: ${fs(ad+c,d)}.`)}
     const [p,q,r,s,P,Q]=ad>c?[a,b,c,d,ad,c]:[c,d,a,b,c,ad];
     return fq(E(`${p}/${q} − ${r}/${s}`),P-Q,d,[[Math.abs(p-r),Math.abs(q-s)||1],[P-Q+1,d],[P+Q,d],[Math.abs(p-r),d]],b===d?`Cùng mẫu: ${P} − ${Q} = ${P-Q}, được ${P-Q}/${d} = ${fs(P-Q,d)}.`:`Quy đồng mẫu số ${d}: ${P}/${d} − ${Q}/${d} = ${P-Q}/${d} = ${fs(P-Q,d)}.`)}},
  {id:'4i',t:'Nhân, chia phân số',note:'Nhân: tử nhân tử, mẫu nhân mẫu. Chia: nhân phân số thứ nhất với phân số thứ hai đảo ngược.',
   g:()=>{const b=R(2,9),d=R(2,9),a=R(1,b+1),c=R(1,d+1);
     if(R(0,1))return fq(E(`${a}/${b} × ${c}/${d}`),a*c,b*d,[[a*d,b*c],[a+c,b+d],[a*c,b+d],[a*c+1,b*d]],`Tử nhân tử: ${a} × ${c} = ${a*c}; mẫu nhân mẫu: ${b} × ${d} = ${b*d}. Được ${a*c}/${b*d} = ${fs(a*c,b*d)}.`);
     return fq(E(`${a}/${b} : ${c}/${d}`),a*d,b*c,[[a*c,b*d],[b*c,a*d],[a*d+1,b*c],[a+d,b+c]],`Đảo ngược phân số thứ hai rồi nhân: ${a}/${b} × ${d}/${c} = ${a*d}/${b*c} = ${fs(a*d,b*c)}.`)}}
 ]}
]},
{n:5,c:'--g5',sub:'Số thập phân · Tỉ số phần trăm · Thể tích · Vận tốc',chap:[
 {t:'Ôn tập phân số, hỗn số',tp:[
  {id:'5a',t:'Hỗn số và phân số thập phân',note:'Hỗn số 2 1/3 = (2 × 3 + 1)/3 = 7/3. Phân số thập phân có mẫu số là 10, 100, 1000…',
   g:()=>{let a,b;do{b=R(2,9);a=R(1,b-1)}while(gcd(a,b)!==1);const w=R(1,4);
     if(R(0,1))return fq(`Chuyển hỗn số ${w} ${a}/${b} thành phân số:`,w*b+a,b,[[w*a+b,b],[w+a,b],[w*b+a,w*b],[w*b-a,b]],`Lấy phần nguyên nhân mẫu số rồi cộng tử số: ${w} × ${b} + ${a} = ${w*b+a}, giữ nguyên mẫu ${b}. Được ${w*b+a}/${b}.`);
     const [m,k]=pick([[2,5],[4,25],[5,2],[20,5],[25,4]]);const n=R(1,m-1);if(gcd(n,m)!==1)return fq(`Phân số 1/${m} viết thành phân số thập phân là:`,k,m*k,[[k+1,m*k],[1,m*10]],`1/${m} = ${k}/${m*k}.`);
     return fq(`Phân số ${n}/${m} bằng phân số nào dưới đây?`,n*k,m*k,[[n*k+1,m*k],[n,m*k],[n+k,m+k]],`Nhân cả tử và mẫu với ${k}: ${n}/${m} = ${n*k}/${m*k}.`)}}
 ]},
 {t:'Số thập phân',tp:[
  {id:'5b',t:'Đọc, viết, so sánh số thập phân',note:'Số thập phân gồm phần nguyên và phần thập phân, ngăn cách bởi dấu phẩy. So sánh phần nguyên trước, rồi lần lượt hàng phần mười, phần trăm, phần nghìn.',
   g:()=>{const k=R(0,2);
     if(k===0){const d=pick([10,100,1000]),n=R(1,d*3-1);if(n%10===0&&d>10)return nq(`Viết ${n+1}/${d} dưới dạng số thập phân:`,(n+1)/d,`${n+1}/${d} = ${f((n+1)/d)}.`,[(n+1)/(d*10),(n+1)/(d/10),(n+1)/d+1]);return nq(`Viết ${n}/${d} dưới dạng số thập phân:`,n/d,`${n}/${d} = ${f(n/d)} (có ${String(d).length-1} chữ số ở phần thập phân).`,[n/(d*10),n/(d/10),n/d+1])}
     if(k===1){const w=R(1,9),a=R(1,9),b=R(1,9),c=R(1,9);const L=[w+a/10+b/100,w+b/10+a/100,w+a/10+b/100+c/1000,w+a/100+c/1000,w+a/10].map(x=>+x.toFixed(3));const u=[...new Set(L)].slice(0,4);while(u.length<4)u.push(+(w+R(1,99)/100).toFixed(3));const big=R(0,1),ans=big?Math.max(...u):Math.min(...u);return ch(`Số ${big?'lớn':'bé'} nhất trong các số ${u.map(f).join('; ')} là:`,f(ans),[...new Set(u.map(f))],`So sánh lần lượt phần nguyên, hàng phần mười, phần trăm, phần nghìn. Số ${big?'lớn':'bé'} nhất là ${f(ans)}.`)}
     let n;do{n=R(1001,9999)}while(n%1000===0);const s=String(n);let p;do{p=R(1,3)}while(s[s.length-p]==='0');const x=n/1000,dg=s[s.length-p],dg2=s[0];return ch(`Trong số ${f(x)}, chữ số ${dg} ở vị trí thứ ${4-p} sau dấu phẩy thuộc hàng nào?`,['phần nghìn','phần trăm','phần mười'][p-1],['phần nghìn','phần trăm','phần mười','đơn vị'],`Sau dấu phẩy lần lượt là hàng phần mười, phần trăm, phần nghìn.`)}}
 ]},
 {t:'Các phép tính với số thập phân',tp:[
  {id:'5c',t:'Cộng, trừ số thập phân',note:'Đặt tính sao cho các dấu phẩy thẳng cột, tính như số tự nhiên, rồi đặt dấu phẩy ở kết quả thẳng cột với các dấu phẩy.',
   g:()=>{const a=R(100,9999)/100,b=R(10,999)/10;if(R(0,1))return nq(E(`${f(a)} + ${f(b)}`),a+b,`Đặt dấu phẩy thẳng cột: ${f(a)} + ${f(b)} = ${f(a+b)}.`,[a+b/10,a+b+1,a+b-0.1,a*10+b]);
     const x=Math.max(a,b),y=Math.min(a,b);return nq(E(`${f(x)} − ${f(y)}`),x-y,`Đặt dấu phẩy thẳng cột: ${f(x)} − ${f(y)} = ${f(x-y)}.`,[x-y+1,x-y+0.1,x-y-0.01])}},
  {id:'5d',t:'Nhân, chia số thập phân',note:'Nhân một số thập phân với 10, 100, 1000: dời dấu phẩy sang phải 1, 2, 3 chữ số. Chia cho 10, 100, 1000: dời dấu phẩy sang trái.',
   g:()=>{const t=R(0,2),a=R(11,999)/10;
     if(t===0){const k=R(2,9);return nq(E(`${f(a)} × ${k}`),a*k,`Nhân như số tự nhiên: ${Math.round(a*10)} × ${k} = ${Math.round(a*10)*k}, rồi tách 1 chữ số ở phần thập phân: ${f(a*k)}.`,[a*k*10,a*k/10,a*k+1])}
     if(t===1){const k=pick([10,100,1000]),m=R(0,1);return m?nq(E(`${f(a)} × ${f(k)}`),a*k,`Dời dấu phẩy sang phải ${String(k).length-1} chữ số: ${f(a*k)}.`,[a*k/10,a*k*10,a/k]):nq(E(`${f(a)} : ${f(k)}`),a/k,`Dời dấu phẩy sang trái ${String(k).length-1} chữ số: ${f(a/k)}.`,[a/k*10,a/k/10,a*k])}
     const k=R(2,9),q=R(11,99)/10;return nq(E(`${f(q*k)} : ${k}`),q,`Thử lại: ${f(q)} × ${k} = ${f(q*k)}.`,[q*10,q/10,q+1])}}
 ]},
 {t:'Hình học',tp:[
  {id:'5e',t:'Tam giác, hình thang, hình tròn',note:'S tam giác = đáy × chiều cao : 2. S hình thang = (đáy lớn + đáy bé) × chiều cao : 2. Hình tròn: C = d × 3,14; S = r × r × 3,14.',
   g:()=>{const t=R(0,3);
     if(t===0){let a,h;do{a=R(4,20);h=R(3,15)}while(a*h%2);return nq(`Tam giác có độ dài đáy ${a} cm, chiều cao ${h} cm. Diện tích là:`,a*h/2,`S = ${a} × ${h} : 2 = ${a*h/2} (cm²).`,[a*h,a+h,(a+h)*2],'','cm²')}
     if(t===1){let a,b,h;do{a=R(8,20);b=R(3,a-1);h=R(3,12)}while((a+b)*h%2);return nq(`Hình thang có đáy lớn ${a} m, đáy bé ${b} m, chiều cao ${h} m. Diện tích là:`,(a+b)*h/2,`S = (${a} + ${b}) × ${h} : 2 = ${(a+b)*h/2} (m²).`,[(a+b)*h,a*b*h/2,(a+b+h)*2],'','m²')}
     const r=R(1,10);if(t===2)return nq(`Hình tròn có bán kính ${r} cm. Chu vi hình tròn là:`,+(r*2*3.14).toFixed(2),`C = d × 3,14 = ${r*2} × 3,14 = ${f(r*2*3.14)} (cm).`,[+(r*3.14).toFixed(2),+(r*r*3.14).toFixed(2),+(r*2*3.14+1).toFixed(2)],'','cm');
     return nq(`Hình tròn có bán kính ${r} cm. Diện tích hình tròn là:`,+(r*r*3.14).toFixed(2),`S = r × r × 3,14 = ${r} × ${r} × 3,14 = ${f(r*r*3.14)} (cm²).`,[+(r*2*3.14).toFixed(2),+(r*3.14).toFixed(2),+(r*r*3.14*4).toFixed(2)],'','cm²')}},
  {id:'5f',t:'Thể tích hình hộp chữ nhật, hình lập phương',note:'V hình hộp chữ nhật = dài × rộng × cao. V hình lập phương = cạnh × cạnh × cạnh. 1 dm³ = 1000 cm³; 1 m³ = 1000 dm³.',
   g:()=>{const t=R(0,2);
     if(t===0){const a=R(3,12),b=R(2,a),c=R(2,9);return nq(`Hình hộp chữ nhật có chiều dài ${a} cm, chiều rộng ${b} cm, chiều cao ${c} cm. Thể tích là:`,a*b*c,`V = ${a} × ${b} × ${c} = ${a*b*c} (cm³).`,[a*b,(a+b)*2*c,a+b+c,a*b*c*2],'','cm³')}
     if(t===1){const a=R(2,10);return nq(`Hình lập phương có cạnh ${a} dm. Thể tích là:`,a*a*a,`V = ${a} × ${a} × ${a} = ${a*a*a} (dm³).`,[a*a*6,a*a,a*3],'','dm³')}
     const x=R(2,9),m=R(0,1);return m?nq(`${x} dm³ = ? cm³`,x*1000,`1 dm³ = 1000 cm³ nên ${x} dm³ = ${f(x*1000)} cm³.`,[x*100,x*10,x*10000],'','cm³'):nq(`${f(x*1000+500)} cm³ = ? dm³`,x+0.5,`1000 cm³ = 1 dm³ nên ${f(x*1000+500)} cm³ = ${f(x+0.5)} dm³.`,[x+0.05,x*10+5,x*100+50],'','dm³')}}
 ]},
 {t:'Tỉ số và các bài toán liên quan',tp:[
  {id:'5g',t:'Tổng – tỉ, hiệu – tỉ, tỉ lệ bản đồ',note:'Vẽ sơ đồ đoạn thẳng, tìm tổng (hoặc hiệu) số phần bằng nhau, tìm giá trị một phần rồi tính từng số. Tỉ lệ 1 : 1000 nghĩa là 1 cm trên bản đồ ứng với 1000 cm ngoài thực tế.',
   g:()=>{const t=R(0,2);
     if(t<2){let a,b;do{a=R(1,5);b=R(a+1,9)}while(gcd(a,b)!==1);const u=R(3,25),sm=a*u,bg=b*u;
       if(t===0)return nq(`Tổng hai số là ${sm+bg}. Tỉ số của số bé và số lớn là ${a}/${b}. Số bé là:`,sm,`Tổng số phần: ${a} + ${b} = ${a+b}. Một phần: ${sm+bg} : ${a+b} = ${u}. Số bé: ${u} × ${a} = ${sm}.`,[bg,u,sm+u]);
       return nq(`Hiệu hai số là ${bg-sm}. Tỉ số của số bé và số lớn là ${a}/${b}. Số lớn là:`,bg,`Hiệu số phần: ${b} − ${a} = ${b-a}. Một phần: ${bg-sm} : ${b-a} = ${u}. Số lớn: ${u} × ${b} = ${bg}.`,[sm,u,bg+u])}
     const [sc,unit,div]=pick([[1000,'m',100],[500,'m',100],[2000,'m',100],[100000,'km',100000],[10000,'m',100]]),x=R(2,9),real=x*sc/div;return nq(`Bản đồ vẽ theo tỉ lệ 1 : ${f(sc)}. Quãng đường dài ${x} cm trên bản đồ thì ngoài thực tế dài bao nhiêu ${unit}?`,real,`Độ dài thật: ${x} × ${f(sc)} = ${f(x*sc)} (cm) = ${f(real)} ${unit}.`,[real*10,real/10,x*sc],'',unit)}},
  {id:'5h',t:'Tỉ số phần trăm',note:'Tìm x% của một số: lấy số đó × x : 100. Tìm tỉ số phần trăm của a và b: lấy a : b rồi nhân với 100 và viết thêm kí hiệu %.',
   g:()=>{if(R(0,1)){const p=pick([10,20,25,40,50,15,30,75,60]),N=R(2,20)*20;return nq(`${p}% của ${N} là:`,N*p/100,`${N} × ${p} : 100 = ${f(N*p/100)}.`,[N/p,N*p/10,N-N*p/100].filter(x=>x>0))}
     const b=pick([20,25,40,50,80,200]);let p;do{p=pick([10,20,25,40,50,60,75,80])}while(!Number.isInteger(b*p/100));const a=b*p/100;
     return nq(`Lớp 5A có ${b} học sinh, trong đó có ${a} học sinh nữ. Số học sinh nữ chiếm bao nhiêu phần trăm số học sinh cả lớp?`,p,`${a} : ${b} = ${f(a/b)} = ${p}%.`,[100-p,a,p/10,b-a],'','%')}}
 ]},
 {t:'Số đo thời gian, toán chuyển động đều',tp:[
  {id:'5i',t:'Đổi số đo thời gian',note:'1 giờ = 60 phút; 1 ngày = 24 giờ; 1 năm = 12 tháng. 0,5 giờ = 30 phút; 1,5 giờ = 90 phút.',
   g:()=>{const t=R(0,2);
     if(t===0){const h=pick([0.5,1.5,2.5,0.25,0.75,1.25]);return nq(`${f(h)} giờ = ? phút`,h*60,`${f(h)} × 60 = ${h*60} (phút).`,[h*100,h*10,h*60+10],'','phút')}
     if(t===1){const h=R(1,4),m=pick([10,15,20,30,45]);return nq(`${h} giờ ${m} phút = ? phút`,h*60+m,`${h} giờ = ${h*60} phút. ${h*60} + ${m} = ${h*60+m} (phút).`,[h*100+m,h+m,h*60+m+10],'','phút')}
     const d=R(2,7);return nq(`${d} ngày = ? giờ`,d*24,`1 ngày = 24 giờ. ${d} × 24 = ${d*24} (giờ).`,[d*12,d*60,d*24+24],'','giờ')}},
  {id:'5k',t:'Vận tốc, quãng đường, thời gian',note:'v = s : t; s = v × t; t = s : v. Đơn vị phải tương ứng: km và giờ → km/giờ; m và giây → m/giây.',
   g:()=>{const v=R(6,12)*5,t=R(2,5),s=v*t,k=R(0,2);
     if(k===0)return nq(`Một ô tô đi với vận tốc ${v} km/giờ trong ${t} giờ. Quãng đường ô tô đi được là:`,s,`s = v × t = ${v} × ${t} = ${s} (km).`,[v+t,s+v,s-v],'','km');
     if(k===1)return nq(`Một xe máy đi quãng đường ${s} km hết ${t} giờ. Vận tốc của xe máy là:`,v,`v = s : t = ${s} : ${t} = ${v} (km/giờ).`,[s*t,v+5,v-5],'','km/giờ');
     return nq(`Một ô tô đi quãng đường ${s} km với vận tốc ${v} km/giờ. Thời gian ô tô đi là:`,t,`t = s : v = ${s} : ${v} = ${t} (giờ).`,[t+1,t-1,t+2],'','giờ')}}
 ]}
]}
];


/* ===== GIẢI BÀI TOÁN CÓ LỜI VĂN ===== */
const NAMES=['An','Bình','Mai','Lan','Hùng','Minh','Hoa','Nam','Linh','Khôi'];
const two=()=>{const a=pick(NAMES);let b;do{b=pick(NAMES)}while(b===a);return [a,b]};
const IT=[['quả cam','quả'],['cái kẹo','cái'],['quyển vở','quyển'],['bông hoa','bông'],['viên bi','viên'],['nhãn vở','nhãn']];
const BG=(L,ans)=>`<b>Bài giải</b><br>${L.join('<br>')}<br><b>Đáp số:</b> ${ans}`;
const OPS={'+':(a,b)=>a+b,'−':(a,b)=>a-b,'×':(a,b)=>a*b,':':(a,b)=>a/b};
function W(q,steps,unit,full,cands){
  const S=steps.map(([lg,t,u])=>{let r=t[0];for(let i=1;i<t.length;i+=2)r=OPS[t[i]](r,t[i+1]);return {lg,t,u,r:+r.toFixed(6)}});
  const ans=S[S.length-1].r;
  const e=BG(S.map(s=>`${s.lg}<br>${s.t.map(x=>typeof x==='number'?f(x):x).join(' ')} = ${f(s.r)} (${s.u})`),`${f(ans)} ${full||unit}`);
  const o=nq(q,ans,e,cands,'',unit);o.fill={S,unit,ans};return o;
}
function ncAdd(){const t1=R(1,7),t2=R(1,8-t1),u1=R(0,8),u2=R(0,9-u1);return [t1*10+u1,t2*10+u2]}
function ncSub(){const t1=R(3,9),t2=R(1,t1-1),u1=R(1,9),u2=R(0,u1);return [t1*10+u1,t2*10+u2]}
const WORD={
1:[{id:'1w',w:1,t:'Bài toán thêm, bớt',note:'Đọc kĩ đề: "thêm, tất cả, cả hai" thì làm tính cộng; "bớt, cho đi, còn lại" thì làm tính trừ. Bài giải gồm: câu lời giải, phép tính (kèm đơn vị trong ngoặc) và đáp số.',
 g:()=>{const [x,y]=two(),[nm,cl]=pick(IT),big=Math.random()<.5,t=R(0,3);let a,b;
  if(t===0){if(big)[a,b]=ncAdd();else{a=R(1,8);b=R(1,10-a)}return W(`${x} có ${a} ${nm}, ${y} cho ${x} thêm ${b} ${nm}. Hỏi ${x} có tất cả bao nhiêu ${nm}?`,[[`Số ${nm} ${x} có tất cả là:`,[a,'+',b],cl]],cl,nm,[Math.abs(a-b),a+b+1,a+b-1])}
  if(t===1){if(big)[a,b]=ncSub();else{a=R(3,10);b=R(1,a-1)}return W(`${x} có ${a} ${nm}, ${x} cho ${y} ${b} ${nm}. Hỏi ${x} còn lại bao nhiêu ${nm}?`,[[`Số ${nm} ${x} còn lại là:`,[a,'−',b],cl]],cl,nm,[a+b,a-b+1,a-b-1])}
  if(t===2){[a,b]=ncAdd();return W(`Tổ Một trồng được ${a} cây, tổ Hai trồng được ${b} cây. Hỏi cả hai tổ trồng được bao nhiêu cây?`,[['Số cây cả hai tổ trồng được là:',[a,'+',b],'cây']],'cây','cây',[Math.abs(a-b),a+b+10,a+b-1])}
  do{a=R(25,39);b=R(10,a-10)}while(a%10<b%10);return W(`Lớp 1A có ${a} học sinh, trong đó có ${b} học sinh nam. Hỏi lớp 1A có bao nhiêu học sinh nữ?`,[['Số học sinh nữ của lớp 1A là:',[a,'−',b],'học sinh']],'học sinh','học sinh',[a+b,a-b+1,a-b-10])}}],
2:[{id:'2w1',w:1,t:'Bài toán về nhiều hơn, ít hơn',note:'"Nhiều hơn" thì lấy số đã biết cộng thêm phần hơn. "Ít hơn" thì lấy số đã biết trừ đi phần kém.',
 g:()=>{const [x,y]=two(),[nm,cl]=pick(IT),a=R(15,60);
  if(R(0,1)){const d=R(5,Math.min(30,99-a));return W(`${x} có ${a} ${nm}. ${y} có nhiều hơn ${x} ${d} ${nm}. Hỏi ${y} có bao nhiêu ${nm}?`,[[`Số ${nm} ${y} có là:`,[a,'+',d],cl]],cl,nm,[a-d,a+d+10,d])}
  const d=R(5,a-5);return W(`${x} có ${a} ${nm}. ${y} có ít hơn ${x} ${d} ${nm}. Hỏi ${y} có bao nhiêu ${nm}?`,[[`Số ${nm} ${y} có là:`,[a,'−',d],cl]],cl,nm,[a+d>99?a-d+10:a+d,a-d-10,d])}},
 {id:'2w2',w:1,t:'Bài toán về phép nhân, phép chia',note:'Mỗi nhóm có số lượng bằng nhau, hỏi tất cả thì làm phép nhân. Chia đều thành các phần bằng nhau thì làm phép chia.',
 g:()=>{const n=R(2,10),t=R(0,3);
  if(t===0)return W(`Mỗi con gà có 2 chân. Hỏi ${n} con gà có bao nhiêu chân?`,[[`Số chân của ${n} con gà là:`,[2,'×',n],'chân']],'chân','chân',[2+n,2*n+2,2*n-2]);
  if(t===1)return W(`Mỗi bàn tay có 5 ngón tay. Hỏi ${n} bàn tay có bao nhiêu ngón tay?`,[[`Số ngón tay của ${n} bàn tay là:`,[5,'×',n],'ngón tay']],'ngón tay','ngón tay',[5+n,5*n+5,5*n-5]);
  const k=pick([2,5]);
  if(t===2)return W(`Có ${k*n} quyển vở chia đều cho ${k} bạn. Hỏi mỗi bạn được mấy quyển vở?`,[['Số quyển vở mỗi bạn được là:',[k*n,':',k],'quyển']],'quyển','quyển vở',[k*n-k,n+1,n-1]);
  return W(`Có ${k*n} học sinh xếp đều thành các hàng, mỗi hàng ${k} bạn. Hỏi xếp được mấy hàng?`,[['Số hàng xếp được là:',[k*n,':',k],'hàng']],'hàng','hàng',[k*n-k,n+1,n-1])}}],
3:[{id:'3w1',w:1,t:'Gấp lên, giảm đi một số lần',note:'Gấp một số lên nhiều lần: lấy số đó nhân với số lần. Giảm một số đi nhiều lần: lấy số đó chia cho số lần. Số lớn gấp mấy lần số bé: lấy số lớn chia cho số bé.',
 g:()=>{const a=R(2,12),k=R(2,9),N=a*k,t=R(0,2);
  if(t===0)return W(`Đoạn dây xanh dài ${a} m. Đoạn dây đỏ dài gấp ${k} lần đoạn dây xanh. Hỏi đoạn dây đỏ dài bao nhiêu mét?`,[['Đoạn dây đỏ dài là:',[a,'×',k],'m']],'m','m',[a+k,N+a,N-a]);
  if(t===1)return W(`Bao gạo nặng ${N} kg. Túi gạo nặng bằng số ki-lô-gam của bao gạo giảm đi ${k} lần. Hỏi túi gạo nặng bao nhiêu ki-lô-gam?`,[['Túi gạo nặng là:',[N,':',k],'kg']],'kg','kg',[N-k,a+1,k]);
  return W(`Con gà nặng ${a} kg, con chó nặng ${N} kg. Hỏi con chó nặng gấp mấy lần con gà?`,[['Con chó nặng gấp con gà số lần là:',[N,':',a],'lần']],'lần','lần',[N-a,k+1,k-1])}},
 {id:'3w2',w:1,t:'Bài toán giải bằng hai bước tính',note:'Bài toán hai bước: tìm một số trung gian trước (bước 1), rồi dùng số đó để tìm điều bài hỏi (bước 2). Mỗi bước viết một câu lời giải và một phép tính.',
 g:()=>{const [x]=two(),t=R(0,2);
  if(t===0){const a=R(35,60)*10,b=R(5,15)*10,c=R(5,15)*10;return W(`Một cửa hàng có ${a} l dầu. Buổi sáng bán được ${b} l, buổi chiều bán được ${c} l. Hỏi cửa hàng còn lại bao nhiêu lít dầu?`,[['Cả ngày cửa hàng bán được là:',[b,'+',c],'l'],['Cửa hàng còn lại số lít dầu là:',[a,'−',b+c],'l']],'l','l dầu',[a-b,b+c,a-b+c])}
  if(t===1){const n=R(3,9),k=R(4,10),m=R(2,n*k-3);return W(`${x} có ${n} hộp bút chì, mỗi hộp có ${k} cái. ${x} cho bạn ${m} cái. Hỏi ${x} còn lại bao nhiêu cái bút chì?`,[[`${x} có tất cả số bút chì là:`,[k,'×',n],'cái'],[`${x} còn lại số bút chì là:`,[n*k,'−',m],'cái']],'cái','cái bút chì',[n*k,n*k+m,n*k-m+10])}
  const a=R(40,300),d=R(10,90);return W(`Thùng thứ nhất có ${a} quyển sách, thùng thứ hai có nhiều hơn thùng thứ nhất ${d} quyển. Hỏi cả hai thùng có bao nhiêu quyển sách?`,[['Thùng thứ hai có số quyển sách là:',[a,'+',d],'quyển'],['Cả hai thùng có số quyển sách là:',[a,'+',a+d],'quyển']],'quyển','quyển sách',[a+d,2*a,2*a-d])}},
 {id:'3w3',w:1,t:'Bài toán liên quan đến rút về đơn vị',note:'Bước 1: tìm giá trị của một phần (phép chia). Bước 2: tìm giá trị của nhiều phần (phép nhân).',
 g:()=>{const n=R(2,9),u=R(2,9);let m;do{m=R(2,9)}while(m===n);const [nm,un,uw]=pick([['túi gạo','kg','ki-lô-gam'],['can dầu','l','lít'],['hộp bánh','cái','cái bánh']]);
  return W(`${n} ${nm} như nhau chứa tất cả ${n*u} ${un}. Hỏi ${m} ${nm} như thế chứa bao nhiêu ${uw}?`,[[`Mỗi ${nm} chứa là:`,[n*u,':',n],un],[`${m} ${nm} chứa là:`,[u,'×',m],un]],un,un,[u,n*u+m,n*u*m,n*u-m].filter(v=>v>0))}}],
4:[{id:'4w1',w:1,t:'Rút về đơn vị (dạng chia hai lần)',note:'Bước 1: tìm giá trị một phần bằng phép chia. Bước 2: lấy tổng số chia cho giá trị một phần để tìm số phần.',
 g:()=>{const u=R(3,9),n=R(2,8);let m;do{m=R(3,12)}while(m===n);return W(`Có ${n*u} kg gạo đóng đều vào ${n} túi. Hỏi có ${m*u} kg gạo thì đóng được bao nhiêu túi như thế?`,[['Mỗi túi đựng số gạo là:',[n*u,':',n],'kg'],[`Số túi để đựng ${m*u} kg gạo là:`,[m*u,':',u],'túi']],'túi','túi',[u,m+1,m-1,m+2])}},
 {id:'4w2',w:1,t:'Tìm phân số của một số',note:'Muốn tìm 3/4 của một số, ta lấy số đó chia cho 4 rồi nhân với 3 (hoặc nhân số đó với 3/4).',
 g:()=>{let a,b;do{b=R(2,5);a=R(1,b-1)}while(gcd(a,b)!==1);const N=b*R(6,10),one=N/b,p=one*a;
  if(R(0,1))return W(`Lớp 4A có ${N} học sinh, trong đó ${a}/${b} số học sinh là học sinh nữ. Hỏi lớp 4A có bao nhiêu học sinh nữ?`,[[`1/${b} số học sinh của lớp 4A là:`,[N,':',b],'học sinh'],['Số học sinh nữ của lớp 4A là:',[one,'×',a],'học sinh']],'học sinh','học sinh',[one,N-p,p+b]);
  return W(`Một tấm vải dài ${N} m. Người ta đã bán ${a}/${b} tấm vải. Hỏi tấm vải còn lại bao nhiêu mét?`,[[`1/${b} tấm vải dài là:`,[N,':',b],'m'],['Số mét vải đã bán là:',[one,'×',a],'m'],['Tấm vải còn lại số mét là:',[N,'−',p],'m']],'m','m',[p,one,N-p+b])}},
 {id:'4w3',w:1,t:'Bài toán mua bán nhiều bước',note:'Tiền hàng = giá một món × số món. Tiền trả lại = tiền đưa − tiền hàng.',
 g:()=>{const p=R(5,12)*1000,n=R(3,9),tot=p*n,pay=tot<50000?50000:tot<100000?100000:200000,[nm,cl]=pick([['quyển vở','quyển'],['cây bút','cây'],['hộp sữa','hộp']]);
  return W(`Mẹ mua ${n} ${nm}, mỗi ${cl} giá ${f(p)} đồng. Mẹ đưa cô bán hàng ${f(pay)} đồng. Hỏi cô bán hàng phải trả lại mẹ bao nhiêu tiền?`,[[`Mua ${n} ${nm} hết số tiền là:`,[p,'×',n],'đồng'],['Cô bán hàng trả lại mẹ số tiền là:',[pay,'−',tot],'đồng']],'đồng','đồng',[tot,pay-p,pay-tot+p,pay-tot-1000])}}],
5:[{id:'5w1',w:1,t:'Bài toán về quan hệ tỉ lệ',note:'Tỉ lệ thuận: số này gấp lên bao nhiêu lần thì số kia cũng gấp lên bấy nhiêu lần. Tỉ lệ nghịch: số người tăng lên bao nhiêu lần thì số ngày giảm đi bấy nhiêu lần. Có thể giải bằng cách rút về đơn vị.',
 g:()=>{if(R(0,1)){const p=R(2,9)*10000,a=R(2,6);let b;do{b=R(2,9)}while(b===a);return W(`Mua ${a} m vải hết ${f(a*p)} đồng. Hỏi mua ${b} m vải cùng loại thì hết bao nhiêu tiền?`,[['Mua 1 m vải hết số tiền là:',[a*p,':',a],'đồng'],[`Mua ${b} m vải hết số tiền là:`,[p,'×',b],'đồng']],'đồng','đồng',[p,a*p+b*1000,(a+b)*p])}
  const a=R(2,8),k=R(2,4),d2=R(2,6),d=k*d2,b=a*k,Wk=a*d;return W(`${a} người làm xong một công việc trong ${d} ngày. Muốn làm xong công việc đó trong ${d2} ngày thì cần bao nhiêu người? (Mức làm của mỗi người như nhau)`,[['Một người làm xong công việc đó trong:',[d,'×',a],'ngày'],[`Muốn làm xong trong ${d2} ngày thì cần số người là:`,[Wk,':',d2],'người']],'người','người',[a*d2,b+a,Math.max(1,a-k)])}},
 {id:'5w2',w:1,t:'Bài toán về tỉ số phần trăm',note:'Tìm p% của một số: lấy số đó × p : 100. Giá sau khi giảm p% = giá cũ − tiền được giảm.',
 g:()=>{const t=R(0,2);
  if(t===0){const P=R(10,40)*10000,p=pick([10,20,25,30,50]),g=P*p/100;return W(`Một chiếc cặp sách giá ${f(P)} đồng, nay được giảm giá ${p}%. Hỏi giá chiếc cặp sau khi giảm là bao nhiêu?`,[['Số tiền được giảm là:',[P,'×',p,':',100],'đồng'],['Giá chiếc cặp sau khi giảm là:',[P,'−',g],'đồng']],'đồng','đồng',[g,P-p*1000,P+g])}
  if(t===1){const P=R(2,20)*1000000,r=pick([5,6,7,8]),l=P*r/100;return W(`Bác An gửi tiết kiệm ${f(P)} đồng với lãi suất ${r}% một năm. Hỏi sau một năm bác An nhận được bao nhiêu tiền lãi?`,[['Số tiền lãi sau một năm là:',[P,'×',r,':',100],'đồng']],'đồng','đồng',[P+l,l*10,l/10])}
  const N=R(4,12)*100,p=pick([40,45,52,55,60]),nu=N*p/100;return W(`Một trường có ${N} học sinh, trong đó số học sinh nữ chiếm ${p}%. Hỏi trường có bao nhiêu học sinh nam?`,[['Số học sinh nữ là:',[N,'×',p,':',100],'học sinh'],['Số học sinh nam là:',[N,'−',nu],'học sinh']],'học sinh','học sinh',[nu,N-p,N*(100-p)/10])}},
 {id:'5w3',w:1,t:'Chuyển động ngược chiều, cùng chiều, trên dòng nước',note:'Ngược chiều gặp nhau: thời gian = quãng đường : (v₁ + v₂). Cùng chiều đuổi kịp: thời gian = khoảng cách : (v₁ − v₂). Xuôi dòng: v thuyền + v dòng nước; ngược dòng: v thuyền − v dòng nước.',
 g:()=>{const t=R(0,2);
  if(t===0){const v1=R(8,12)*5,v2=R(6,8)*5,h=R(1,4),S=(v1+v2)*h;return W(`Quãng đường AB dài ${S} km. Cùng một lúc, một ô tô đi từ A với vận tốc ${v1} km/giờ và một xe máy đi từ B với vận tốc ${v2} km/giờ, đi ngược chiều nhau. Hỏi sau mấy giờ hai xe gặp nhau?`,[['Sau mỗi giờ hai xe đi được là:',[v1,'+',v2],'km'],['Thời gian để hai xe gặp nhau là:',[S,':',v1+v2],'giờ']],'giờ','giờ',[h+1,h+2,h+3])}
  if(t===1){const v2=R(6,8)*5,v1=v2+R(2,5)*5,h=R(1,4),d=(v1-v2)*h;return W(`Một xe máy đi trước ô tô ${d} km với vận tốc ${v2} km/giờ. Ô tô đuổi theo với vận tốc ${v1} km/giờ. Hỏi sau mấy giờ ô tô đuổi kịp xe máy?`,[['Sau mỗi giờ ô tô gần xe máy thêm là:',[v1,'−',v2],'km'],['Thời gian để ô tô đuổi kịp xe máy là:',[d,':',v1-v2],'giờ']],'giờ','giờ',[h+1,h+2,h+3])}
  const v=R(12,30),w=R(2,5),x=R(0,1);return W(`Vận tốc của một chiếc thuyền khi nước lặng là ${v} km/giờ, vận tốc dòng nước là ${w} km/giờ. Hỏi vận tốc của thuyền khi ${x?'xuôi':'ngược'} dòng là bao nhiêu?`,[[`Vận tốc của thuyền khi ${x?'xuôi':'ngược'} dòng là:`,[v,x?'+':'−',w],'km/giờ']],'km/giờ','km/giờ',[x?v-w:v+w,v,v*w])}}]
};

const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ds(d)};
function streak(d=data){const set=new Set(d.days);let c=today();if(!set.has(c))c=addDays(c,-1);let n=0;while(set.has(c)){n++;c=addDays(c,-1)}return n}

function acc(id,top,eyeY,neck){
  if(id==='nonla')return `<path d="M50 ${top+12} L100 ${top-30} L150 ${top+12} Q100 ${top+22} 50 ${top+12}Z" fill="#e8cd86" stroke="#b8913f" stroke-width="2.5" stroke-linejoin="round"/><path d="M68 ${top+4} Q100 ${top+10} 132 ${top+4}" stroke="#b8913f" stroke-width="2" fill="none"/><path d="M84 ${top-8} Q100 ${top-4} 116 ${top-8}" stroke="#b8913f" stroke-width="2" fill="none"/>`;
  if(id==='vm')return `<path d="M76 ${top+6} L74 ${top-20} L88 ${top-6} L100 ${top-26} L112 ${top-6} L126 ${top-20} L124 ${top+6}Z" fill="#f6c431" stroke="#c99212" stroke-width="2.5" stroke-linejoin="round"/><circle cx="100" cy="${top-4}" r="4" fill="#e2463a"/>`;
  if(id==='no')return `<g transform="translate(128 ${top+8}) rotate(20)"><path d="M0 0 L-16 -10 L-16 10Z M0 0 L16 -10 L16 10Z" fill="#f383a8" stroke="#d45683" stroke-width="2" stroke-linejoin="round"/><circle r="5" fill="#d45683"/></g>`;
  if(id==='kinh')return `<g fill="rgba(255,255,255,.15)" stroke="#2c2a33" stroke-width="3"><circle cx="85" cy="${eyeY}" r="15"/><circle cx="115" cy="${eyeY}" r="15"/><path d="M100 ${eyeY-2} h0" /></g><path d="M97 ${eyeY-3} Q100 ${eyeY-7} 103 ${eyeY-3}" stroke="#2c2a33" stroke-width="3" fill="none"/>`;
  if(id==='khan'&&neck)return `<path d="M68 ${neck} Q100 ${neck+14} 132 ${neck} L128 ${neck+10} Q100 ${neck+22} 72 ${neck+10}Z" fill="#d83a2e"/><path d="M104 ${neck+12} L120 ${neck+38} L102 ${neck+34}Z" fill="#c22f24"/>`;
  return '';
}

  const nest=`<ellipse cx="100" cy="152" rx="74" ry="14" fill="var(--nest)"/><path d="M30 150 L170 155 M40 158 L160 144 M55 160 L176 150 M26 152 L118 162 M80 146 L150 160" stroke="var(--nest-d)" stroke-width="3.5" stroke-linecap="round"/>`;
  let body='';
  if(st===0){
    body=`<g class="egg"><ellipse cx="100" cy="108" rx="34" ry="42" fill="var(--shell)" stroke="var(--shell-d)" stroke-width="2.5"/><circle cx="86" cy="96" r="6" fill="${b.body}" opacity=".55"/><circle cx="112" cy="118" r="8" fill="${b.body}" opacity=".45"/><circle cx="108" cy="86" r="4" fill="${b.body}" opacity=".5"/></g>`;

    <circle cx="76" cy="118" r="5" fill="#f5a3a3" opacity=".8"/><circle cx="124" cy="118" r="5" fill="#f5a3a3" opacity=".8"/><path d="M96 114 L104 114 L100 121Z" fill="#f08a24"/>
    ${W.includes('nonla')||W.includes('vm')||W.includes('no')?'':`<path d="M100 82 L110 90 L118 80 L128 92 L136 84 Q138 68 120 66 Q102 66 100 82Z" fill="var(--shell)" stroke="var(--shell-d)" stroke-width="2"/>`}
    ${['head','face'].map(s=>wear[s]?acc(wear[s],top,eyeY,0):'').join('')}</g>
    <path d="M62 120 L72 110 L82 122 L92 108 L102 122 L112 109 L122 122 L132 111 L140 120 L140 132 Q100 176 60 132Z" fill="var(--shell)" stroke="var(--shell-d)" stroke-width="2.5" stroke-linejoin="round"/>`;
  }else{

    <ellipse cx="62" cy="112" rx="13" ry="28" fill="${b.ring}" transform="rotate(18 62 112)"/><ellipse cx="138" cy="112" rx="13" ry="28" fill="${b.ring}" transform="rotate(-18 138 112)"/>
    <path d="M66 ${top+16} L70 ${top-tuft} L88 ${top+4}Z M134 ${top+16} L130 ${top-tuft} L112 ${top+4}Z" fill="${b.body}"/>
    <ellipse cx="100" cy="106" rx="40" ry="45" fill="${b.body}"/><ellipse cx="100" cy="122" rx="26" ry="27" fill="${b.belly}"/>
    <path d="M90 118 l4 4 4-4 M102 118 l4 4 4-4 M96 130 l4 4 4-4" stroke="${b.ring}" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="85" cy="${eyeY}" r="13" fill="#fff" stroke="${b.ring}" stroke-width="3"/><circle cx="115" cy="${eyeY}" r="13" fill="#fff" stroke="${b.ring}" stroke-width="3"/>
    <g class="lid"><circle cx="86" cy="${eyeY+1}" r="6" fill="#2c2a33"/><circle cx="116" cy="${eyeY+1}" r="6" fill="#2c2a33"/><circle cx="88" cy="${eyeY-1}" r="2" fill="#fff"/><circle cx="118" cy="${eyeY-1}" r="2" fill="#fff"/></g>

    ${acc(wear.neck,top,eyeY,neck)}${acc(wear.face,top,eyeY,neck)}${acc(wear.head,top,eyeY,neck)}

  return `<svg viewBox="0 0 200 172" role="img" aria-label="Bạn cú ${STAGE[st]}">${nest}${body}</svg>`;

let S={view:'tabs',tab:'hoc',sheet:null,quiz:null,res:null,topic:null,confirm:false,resetAsk:false};
const app=document.getElementById('app'),layer=document.getElementById('layer');
const fr=s=>String(s).replace(/(\d+)\/(\d+)/g,'<span class="fr"><span>$1</span><span>$2</span></span>');
const starStr=n=>`<span class="st" aria-label="${n} trên 3 sao">${'<i>★</i>'.repeat(n)}${'★'.repeat(3-n)}</span>`;
const G=()=>GRADES[data.grade-1];
const isDark=()=>data.theme?data.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
function applyTheme(){if(data.theme)document.documentElement.setAttribute('data-theme',data.theme);else document.documentElement.removeAttribute('data-theme')}
const mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const examDays=()=>{if(!data.exam.date)return null;const n=Math.round((new Date(data.exam.date+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);return n>=0?n:null};
function nextTopic(){const L=G().chap.flatMap(c=>c.tp);return L.find(t=>!data.prog[t.id])||L.find(t=>(data.prog[t.id]||0)<3)||L[0]}
function toast(msg){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

function petMsg(){
  const nm=data.name,dd=examDays(),did=!!data.daily[today()];
  if(dd!==null&&data.exam.name)return dd===0?`Hôm nay thi ${data.exam.name} rồi! ${nm} bình tĩnh, làm thật cẩn thận nha!`:`Còn ${dd} ngày nữa là thi ${data.exam.name}. Mình luyện thêm một đề nha!`;
  if(data.stage===0&&!data.quizzes)return `Chào ${nm}! Mình đang ở trong trứng. Làm bài đúng từ 80% để cho mình ăn, mình sẽ nở ra nhé!`;
  if(!did)return `Hôm nay ${nm} chưa học bài nào. Mình học "${nextTopic().t}" nha!`;
  const left=NEED[data.stage]-data.meals;
  return data.stage<3?`Ngon quá! Thêm ${left} bữa nữa là mình lớn rồi.`:`Cảm ơn ${nm}! Mình no căng rồi, mình cùng làm thử thách 60 giây nhé!`;
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c])}
function vTop(){
  const sk=streak();
  return `<div class="top"><button class="who" data-act="profile" aria-label="Đổi tên và lớp"><span class="av">${(data.name.trim()[0]||'B').toUpperCase()}</span><span class="nm">${esc(data.name)} · Lớp ${data.grade}</span>${I.chev}</button>
  <div class="tr"><span class="pill streak ${sk?'on':''}" title="Số ngày học liên tiếp">${I.flame}${sk}<span>&nbsp;ngày</span></span><span class="pill stars" title="Số sao đang có">${I.star}${data.stars}</span><button class="ib" data-act="theme" aria-label="Đổi giao diện sáng hoặc tối">${isDark()?I.sun:I.moon}</button></div></div>`;
}
const bar=(back,title,right='')=>`<div class="bar"><button class="ib" data-act="${back}" aria-label="Quay lại">‹</button><div class="ttl">${title}</div>${right}</div>`;
function vHero(){
  const need=NEED[data.stage],canSpin=data.spin!==today();
  return `<section class="hero"><svg class="orb" viewBox="0 0 360 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><circle class="planet" cx="180" cy="300" r="120"/><ellipse cx="180" cy="250" rx="190" ry="70" transform="rotate(-14 180 250)"/><ellipse cx="180" cy="250" rx="150" ry="52" transform="rotate(-14 180 250)"/><circle class="sat" cx="338" cy="190" r="7"/></svg>
  <div class="bubble" id="bubble" aria-live="polite">${esc(petMsg())}</div>
  <button class="pet" id="pet" data-act="pet" aria-label="Chạm vào ${esc(data.pet)}">${mascot()}</button>
  <div class="petrow"><button class="pname" data-act="rename" aria-label="Đổi tên bạn cú">${esc(data.pet)} ${I.pencil}</button><span class="stage">${STAGE[data.stage]} · ${data.stage}/3</span></div>
  <div class="meal"><div class="mbar"><i style="width:${Math.min(100,data.meals/need*100)}%"></i></div><b>${data.meals}/${need} bữa</b><small>đạt 80% = 1 bữa</small></div>
  <div class="acts"><button data-act="buddy">Đổi bạn</button><button data-act="spin" aria-label="Vòng quay${canSpin?', có lượt quay hôm nay':''}">Vòng quay${canSpin?'<i class="dot"></i>':''}</button></div></section>`;
}
const tile=(cls,act,arg,ic,t,s)=>`<button class="tile ${cls}" data-act="${act}" ${arg?`data-arg="${arg}"`:''}><span class="ti">${ic}</span><b>${t}</b><small>${s}</small></button>`;
function vHoc(){
  const r=data.resume,nt=nextTopic(),dd=examDays();
  let T=tile('brand','topic',nt.id,I.play,'Học tiếp',fr(nt.t));
  if(r){const done=r.kind==='exam'?r.ans.filter(x=>x!==null).length:r.i;T+=tile('dark','resume','',I.timer,'Làm tiếp',`${fr(r.title)} · ${done}/${r.qs.length}${r.kind==='exam'?' · '+mmss(r.left):''}`)}
  else T+=tile('mist','fillMix','',I.pencil,'Toán lời văn','Điền bài giải 5 bài');
  if(dd!==null&&data.exam.name)T+=tile('amber','exam','',String(dd),`Thi ${esc(data.exam.name)}`,dd?`Còn ${dd} ngày · luyện 1 đề`:'Hôm nay thi! Ôn 1 đề');
  else T+=tile('amber','blitz','','60','Thử thách 60 giây',`Kỷ lục: ${data.bestBlitz} câu`);
  T+=tile('dark','mix','',I.mix,'Ôn tập',`10 câu trộn lớp ${data.grade}`);
  return vTop()+`<div class="main">${vHero()}<div class="todayh"><h2>Hôm nay của ${esc(data.name)}</h2><button class="link" data-act="route">Lộ trình ›</button></div><div class="tiles">${T}</div></div>`;
}
function vRouteView(){
  const g=G();let have=0,max=0;g.chap.forEach(c=>c.tp.forEach(t=>{have+=data.prog[t.id]||0;max+=3}));
  if(S.rch===null||S.rch>=g.chap.length){const nt=nextTopic();S.rch=Math.max(0,g.chap.findIndex(c=>c.tp.some(t=>t.id===nt.id)))}
  const c=g.chap[S.rch];
  return bar('back',`Lộ trình lớp ${g.n}`,`<span class="meta">${have}/${max} ★</span>`)+
  `<div class="main" style="--gc:var(${g.c})">
   <div class="gpick">${[1,2,3,4,5].map(n=>`<button class="${n===data.grade?'on':''}" style="--gc:var(${GRADES[n-1].c})" data-act="rGrade" data-arg="${n}" aria-label="Lớp ${n}">${n}</button>`).join('')}</div>
   <div class="chips" id="rchips">${g.chap.map((ch,i)=>{const done=ch.tp.every(t=>(data.prog[t.id]||0)>=3);return `<button class="${i===S.rch?'on':''}" data-act="rch" data-arg="${i}">Chủ đề ${i+1}${done?' ✓':''}</button>`}).join('')}</div>
   <section class="chapc"><h3><em>Chủ đề ${S.rch+1} / ${g.chap.length}</em>${c.t}</h3>${c.tp.map(t=>`<button class="trow" data-act="topic" data-arg="${t.id}"><span>${fr(t.t)}</span>${starStr(data.prog[t.id]||0)}</button>`).join('')}</section>
  </div><div class="foot"><div class="row2"><button class="btn sec2" data-act="rch" data-arg="${S.rch-1}" ${S.rch?'':'disabled'}>‹ Chủ đề trước</button><button class="btn sec2" data-act="rch" data-arg="${S.rch+1}" ${S.rch<g.chap.length-1?'':'disabled'}>Chủ đề sau ›</button></div></div>`;
}
function vArena(){
  const dd=examDays();
  return vTop()+`<div class="main"><h1 class="ptitle">Đấu trường<small>Kiến thức lớp ${data.grade}</small></h1>

function vFill(q,fv){
